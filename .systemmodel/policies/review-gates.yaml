review_gates:
  - id: gate.merge_review
    name: Merge Path Review
    description: Human review required for worktree merge, approval, force, retry, discard, or cleanup behavior.
    blocks_merge: true
    required_when:
      files: [server/worktree-merge.ts, server/worktree.ts, server/commands/approve-changes.ts, server/commands/merge-worktree.ts, server/commands/force-merge.ts, server/commands/retry-merge.ts, server/commands/discard-worktree.ts]
      capabilities: [capability.worktree_approval]
      risk: [high, critical]
  - id: gate.ws_contract_review
    name: WebSocket Contract Review
    description: Review changes that alter command dispatch, bus envelopes, or server/client shared WS contracts.
    blocks_merge: true
    required_when:
      files: [server/bus.ts, server/ws-connection.ts, shared/ws-envelope.ts]
      capabilities: [capability.ws_command_bus]
      risk: [high, critical]
  - id: gate.system_model_review
    name: System Model Review
    description: Review model edits for bloat, stale suggested files, and agent-useful summaries.
    blocks_merge: false
    required_when:
      files: [.systemmodel/**, shared/system-model/**, server/system-model/**]
      capabilities: [capability.system_model_layer]
      risk: [medium, high, critical]

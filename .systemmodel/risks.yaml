risks:
  - id: risk.merge_bypass
    type: risk
    summary: A merge command can bypass approval or system-model gates if it calls cleanup directly.
    severity: critical
    applies_to:
      capabilities: [capability.worktree_approval]
      flows: []
      files: [server/commands/merge-worktree.ts, server/commands/approve-changes.ts, server/worktree.ts]
    mitigation: Keep merge gating centralized and test every merge command path.
  - id: risk.parallel_work_conflicts
    type: risk
    summary: Concurrent minions can edit overlapping paths unless leaders assign narrow ownership boundaries.
    severity: high
    applies_to:
      capabilities: [capability.task_delegation, capability.worktree_approval]
      flows: []
      files: [server/task-tools/assign-task.ts, server/worktree-create.ts]
    mitigation: Use ownedPaths, task constraints, and worktree isolation for parallel code edits.
  - id: risk.command_contract_drift
    type: risk
    summary: WebSocket command producers and client parsers can drift when command schemas, envelopes, or handler registration change.
    severity: high
    applies_to:
      capabilities: [capability.ws_command_bus, capability.canvas_sessions]
      flows: []
      files: [server/commands/schemas.ts, server/bus.ts, shared/ws-envelope.ts, src/api.ts]
    mitigation: Keep the command table exhaustive and run contract tests for producer/consumer behavior.
  - id: risk.render_schema_drift
    type: risk
    summary: Render DSL server tools and client components can diverge if schema changes are not shared and tested end to end.
    severity: medium
    applies_to:
      capabilities: [capability.render_dashboard]
      flows: []
      files: [server/render-tools.ts, shared/render-dsl.ts, src/nodes/RenderNode.tsx]
    mitigation: Keep DSL schemas in shared/ and cover server tool output plus client render application.
  - id: risk.session_state_drift
    type: risk
    summary: Persisted session, dashboard, cost, or project settings state can fall out of sync with live canvas state.
    severity: high
    applies_to:
      capabilities: [capability.canvas_sessions, capability.persistence_project_state]
      flows: []
      files: [server/session-persist.ts, server/session-host.ts, server/project-store.ts, server/db.ts]
    mitigation: Round-trip persistence through real writers/readers and emit state changes through the bus.
  - id: risk.prompt_bloat
    type: risk
    summary: Skill and system-model context can crowd out task-critical instructions if objects are too broad or duplicated.
    severity: medium
    applies_to:
      capabilities: [capability.skill_library, capability.system_model_layer]
      flows: []
      files: [server/skills.ts, shared/skill-presets.ts, .systemmodel]
    mitigation: Enforce bloat-guard authoring rules and context budgets.
  - id: risk.model_rot
    type: risk
    summary: Human-authored model objects can become stale when suggested files change without corresponding model updates.
    severity: high
    applies_to:
      capabilities: [capability.system_model_layer]
      flows: []
      files: [.systemmodel, server/system-model]
    mitigation: Run system-model validation and freshness checks before relying on model context.

id: capability.project_workspace
type: capability
name: Project workspace lifecycle
summary: Users can register, rebind, or explicitly attach a source folder by stable workspace identity, explicitly initialize Git or acknowledge the risks of continuing without it, keep all Minions state and worktrees centrally, recover persisted state, and reconnect without duplicating work.
constraints: []
decisions: [ decision.typed_event_bus, decision.canonical_work_item_lifecycle, decision.portable_workspace_roots ]
risks:
  - risk.project_worktree_content_split
  - risk.legacy_workspace_root_overlap
suggested_files: [ src/ProjectList.tsx, src/ProjectGitWarning.tsx, src/App.tsx, src/ProjectHeader.tsx, src/ProjectPanel.tsx, src/api.ts, src/use-autosave.ts, server/project-git.ts, server/workspace-registry.ts, server/project-store.ts, server/routes/projects/core.ts, server/routes/projects/git.ts, server/routes/projects/workspace-lifecycle.ts ]
suggested_tests: [ src/ProjectList.test.tsx, src/mobile/ProjectsScreen.test.tsx, src/App.dom.test.tsx, src/api.test.ts, src/use-autosave.test.tsx, src/canvas-work-item-reconcile.test.ts, server/project-git.test.ts, server/workspace-registry.test.ts, server/project-store.test.ts, tests/contracts/projects-core-routes.test.ts ]
keywords: [ project, workspace, uuid, source_root, state_root, MINIONS_HOME, mounted_volume, open, create, recover, migration, sidecar, readiness, git, initial_commit ]
entry_points:
  - surface: surface.canvas
    summary: Open, load, save, and recover the desktop spatial project shell.
    files: [ src/ProjectList.tsx, src/App.tsx, src/ProjectHeader.tsx, src/ProjectPanel.tsx ]
    tests: [ src/ProjectList.test.tsx, src/App.dom.test.tsx, src/ProjectPanel.test.ts, src/use-autosave.test.tsx ]
    flows: [ flow.open_project_workspace, flow.save_project_knowledge, flow.recover_after_disconnect ]
  - surface: surface.mobile
    summary: Create or select a project, make an explicit Git initialization choice when needed, and reconnect its remote session views.
    files: [ src/mobile/ProjectsScreen.tsx, src/ProjectGitWarning.tsx, src/mobile/MobileApp.tsx ]
    tests: [ src/mobile/ProjectsScreen.test.tsx, src/mobile/MobileApp.test.tsx ]
    flows: [ flow.open_project_workspace, flow.recover_after_disconnect ]
  - surface: surface.ws_api
    summary: Check Git readiness, enforce an explicit non-Git initialization choice, resolve registered workspace UUIDs, explicitly rebind or attach source roots, and synchronize project sessions, WorkItems, and lineages.
    files: [ server/project-git.ts, server/workspace-registry.ts, server/routes/projects/core.ts, server/routes/projects/git.ts, server/routes/projects/workspace-lifecycle.ts, server/commands/create-session.ts, server/commands/work-items.ts, server/commands/list-sessions.ts, server/commands/list-worktree-lineages.ts, server/commands/sync-session.ts ]
    tests: [ server/project-git.test.ts, server/workspace-registry.test.ts, tests/contracts/projects-core-routes.test.ts, server/commands/create-session.test.ts, server/commands/list-sessions.test.ts, server/commands/work-items.test.ts, server/commands/sync-session.test.ts ]
    flows: [ flow.open_project_workspace, flow.recover_after_disconnect ]
freshness:
  class: code_coupled
risk: high
domain: domain.workspace
depends_on: []
bridges:
  - to: flow.recover_after_disconnect
    reason: Project reopening restores session truth through the observability-owned reconnect flow.

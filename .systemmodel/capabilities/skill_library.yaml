id: capability.skill_library
type: capability
name: Skill Library And Authoring
summary: Project-scoped skill templates can be browsed, authored, persisted, merged with shared built-in presets, compiled with variables, and extended with on-demand subskills.
linked_flows:
  - flow.skill_library_list_get
  - flow.skill_authoring_create_tool
  - flow.skill_authoring_update_override_tool
  - flow.skill_authoring_delete_tool
  - flow.skill_frontend_browser_editor_sync
  - flow.skill_builtin_preset_resolution
  - flow.skill_template_variable_compile
  - flow.skill_subskill_map_load
constraints:
  - constraint.no_cross_tree_imports
  - constraint.model_bloat_guard
  - constraint.server_file_size_ceiling
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.prompt_bloat
  - risk.model_rot
  - risk.command_contract_drift
  - risk.session_state_drift
suggested_files:
  - server/skills.ts
  - server/skill-authoring.ts
  - server/skill-authoring-tools.ts
  - server/subskills.ts
  - server/subskill-tools.ts
  - shared/skill-presets.ts
  - src/skills/types.ts
  - src/skills/registry.ts
suggested_tests:
  - server/skills.test.ts
  - server/skill-authoring.test.ts
  - server/skill-authoring-tools.test.ts
  - server/subskills.test.ts
  - src/skills/types.test.ts
  - src/skills/registry.test.ts
  - src/skills/user-skills.test.ts
keywords:
  - skills
  - skill-builder
  - skill-library
  - skill-template
  - built-in-preset
  - subskill
  - load_subskill
  - skills.json
  - variable-substitution
freshness:
  class: code_coupled
risk: high

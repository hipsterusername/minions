id: capability.runtime_configuration
type: capability
name: Runtime configuration
summary: Users can choose compatible harness and model settings while independently configuring Git change placement and a truthfully reported process sandbox policy.
constraints: []
decisions: [ decision.role_gated_agent_tools, decision.portable_workspace_roots ]
suggested_files: [ src/SettingsMenu.tsx, src/components/SessionToolbar.tsx, src/nodes/leader/SandboxPolicyControls.tsx, server/harness/sandbox-policy.ts, server/harness/codex/options.ts, server/commands/list-harnesses.ts ]
suggested_tests: [ src/SettingsMenu.test.tsx, src/components/SessionToolbar.test.tsx, src/nodes/leader/SandboxPolicyControls.test.tsx, server/harness/sandbox-policy.test.ts, server/harness/codex/options.test.ts, server/commands/list-harnesses.test.ts ]
keywords: [ runtime, harness, model, sandbox, filesystem, approval, unmanaged, worktree, change_mode, control_error ]
entry_points:
  - surface: surface.canvas
    summary: Configure Git change mode separately from the requested filesystem and approval sandbox axes.
    files: [ src/SettingsMenu.tsx, src/components/SessionToolbar.tsx, src/nodes/LeaderNode.tsx, src/nodes/leader/SandboxPolicyControls.tsx, src/nodes/leader/ConfigFooter.tsx ]
    tests: [ src/SettingsMenu.test.tsx, src/components/SessionToolbar.test.tsx, src/nodes/LeaderNode.test.tsx, src/nodes/leader/SandboxPolicyControls.test.tsx, src/nodes/leader/ConfigFooter.test.tsx ]
    flows: [ flow.configure_runtime, flow.launch_leader, flow.steer_session ]
  - surface: surface.mobile
    summary: Set mobile defaults and per-launch harness, model, permission, and isolation choices.
    files: [ src/mobile/SettingsScreen.tsx, src/mobile/LaunchScreen.tsx, src/mobile/launch-models.ts ]
    tests: [ src/mobile/SettingsScreen.test.tsx, src/mobile/LaunchScreen.test.tsx, src/mobile/launch-models.test.ts ]
    flows: [ flow.configure_runtime, flow.launch_leader ]
  - surface: surface.ws_api
    summary: Validate requested sandbox axes, report harness enforcement support, and apply supported runtime mutations.
    files: [ shared/workspace-contracts.ts, server/harness/sandbox-policy.ts, server/commands/list-harnesses.ts, server/commands/set-model.ts, server/commands/set-permission-mode.ts ]
    tests: [ shared/workspace-contracts.test.ts, server/harness/sandbox-policy.test.ts, server/commands/list-harnesses.test.ts, server/commands/set-model.test.ts, server/commands/set-permission-mode.test.ts ]
    flows: [ flow.configure_runtime ]
freshness:
  class: code_coupled
risk: high
domain: domain.platform
depends_on: []
bridges:
  - to: flow.launch_leader
    reason: Runtime settings are applied when the execution-lifecycle leader launch flow creates a host.
  - to: flow.steer_session
    reason: Runtime controls affect follow-up behavior owned by the execution-lifecycle steering flow.
risks: [ risk.sandbox_policy_overclaim ]

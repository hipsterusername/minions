id: capability.runtime_configuration
type: capability
name: Runtime configuration
summary: Users can choose compatible harness, model, thinking, permission, and isolation settings at project, launch, or live-session scope.
constraints: []
decisions: [ decision.role_gated_agent_tools ]
suggested_files: [ src/SettingsMenu.tsx, src/components/SessionToolbar.tsx, src/mobile/SettingsScreen.tsx, src/mobile/LaunchScreen.tsx, server/commands/list-harnesses.ts ]
suggested_tests: [ src/SettingsMenu.test.tsx, src/components/SessionToolbar.test.tsx, src/mobile/SettingsScreen.test.tsx, src/mobile/LaunchScreen.test.tsx, server/commands/list-harnesses.test.ts ]
keywords: [ runtime, harness, model, thinking, permission, isolation, worktree, default, override, capability, control_error ]
entry_points:
  - surface: surface.canvas
    summary: Set project defaults and supported live-session controls.
    files: [ src/SettingsMenu.tsx, src/components/SessionToolbar.tsx, src/nodes/LeaderNode.tsx ]
    tests: [ src/SettingsMenu.test.tsx, src/components/SessionToolbar.test.tsx, src/nodes/LeaderNode.test.tsx ]
    flows: [ flow.configure_runtime, flow.launch_leader, flow.steer_session ]
  - surface: surface.mobile
    summary: Set mobile defaults and per-launch harness, model, permission, and isolation choices.
    files: [ src/mobile/SettingsScreen.tsx, src/mobile/LaunchScreen.tsx, src/mobile/launch-models.ts ]
    tests: [ src/mobile/SettingsScreen.test.tsx, src/mobile/LaunchScreen.test.tsx, src/mobile/launch-models.test.ts ]
    flows: [ flow.configure_runtime, flow.launch_leader ]
  - surface: surface.ws_api
    summary: Report harness inventory and apply supported model and permission mutations.
    files: [ server/commands/list-harnesses.ts, server/commands/set-model.ts, server/commands/set-permission-mode.ts ]
    tests: [ server/commands/list-harnesses.test.ts, server/commands/set-model.test.ts, server/commands/set-permission-mode.test.ts ]
    flows: [ flow.configure_runtime ]
freshness:
  class: code_coupled
risk: high
domain: domain.platform
depends_on: []
bridges:
  - to: flow.launch_leader
    reason: Runtime settings are applied when the execution-lifecycle leader launch flow creates a host.
  - to: flow.steer_session
    reason: Runtime controls affect follow-up behavior owned by the execution-lifecycle steering flow.
risks: []

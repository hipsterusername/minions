id: capability.system_model_layer
type: capability
name: System Model Layer
summary: Loads validates queries scopes persists checks reconciles and reports on repo authored model objects used by Work Packets and review gates.
linked_flows:
  - flow.explore_system_model
  - flow.prepare_scoped_work_packet
  - flow.verify_and_reconcile_gated_work
  - flow.review_and_merge_changes
  - flow.maintain_system_model
constraints:
  - constraint.model_bloat_guard
  - constraint.review_gated_merges
  - constraint.no_cross_tree_imports
  - constraint.server_file_size_ceiling
decisions:
  - decision.relevance_scoped_context
  - decision.graph_as_bus
  - decision.worktree_isolation
risks:
  - risk.model_rot
  - risk.prompt_bloat
  - risk.merge_bypass
  - risk.command_contract_drift
  - risk.parallel_work_conflicts
suggested_files:
  - shared/system-model/objects.ts
  - shared/system-model/packet.ts
  - shared/system-model/reconcile.ts
  - server/system-model/load.ts
  - server/system-model/compile.ts
  - server/system-model/gates.ts
  - server/system-model/reconcile.ts
  - server/system-model-tools/index.ts
suggested_tests:
  - server/system-model/load.test.ts
  - server/system-model/compile.test.ts
  - server/system-model/gates.test.ts
  - server/system-model/reconcile.test.ts
  - server/system-model-tools/query-system-model.test.ts
  - server/system-model-tools/model-health.test.ts
  - tests/contracts/system-model-commands.test.ts
keywords:
  - system_model
  - work_packet
  - context_pack
  - review_gate
  - freshness
  - reconciliation
  - model_health
  - query_system_model
freshness:
  class: code_coupled
risk: high

id: capability.durable_work_items
type: capability
name: Durable work items
summary: Users can create a durable intention once, bind it to a canvas node, revision-fence its lifecycle, and retain run history beyond any node or session.
constraints: []
decisions: [ decision.canonical_work_item_lifecycle ]
risks:
  - risk.dual_ingress_divergence
suggested_files: [ shared/work-item-contracts.ts, server/work-item-service.ts, server/commands/work-items.ts, src/use-work-items.ts ]
suggested_tests: [ tests/contracts/work-item-contracts.test.ts, server/commands/work-items.test.ts, server/work-item-service-sqlite.test.ts, src/use-work-items.test.ts ]
keywords: [ work_item, durable, lifecycle, revision, cas, binding, run_history, current_run_key, archive, restore ]
entry_points:
  - surface: surface.canvas
    summary: Bind and reconcile Leader nodes without making spatial deletion erase durable identity.
    files: [ src/nodes/leader/use-canvas-work-item.ts, src/nodes/leader/work-item.ts, src/canvas-work-item-reconcile.ts ]
    tests: [ src/nodes/leader/work-item.test.ts, src/canvas-work-item-reconcile.test.ts ]
    flows: [ flow.launch_leader, flow.recover_after_disconnect ]
  - surface: surface.activity
    summary: Review, archive, restore, reply to, and inspect canonical work and run history.
    files: [ src/ActivityView.tsx, src/use-work-items.ts ]
    tests: [ src/ActivityView.test.tsx, src/use-work-items.test.ts ]
    flows: [ flow.triage_attention, flow.steer_session ]
  - surface: surface.mobile
    summary: Project canonical lifecycle state into remote Activity and session controls.
    files: [ src/mobile/ActivityScreen.tsx, src/mobile/mobile-activity-actions.ts ]
    tests: [ src/mobile/ActivityScreen.test.tsx, src/mobile/mobile-activity-actions.test.ts ]
    flows: [ flow.triage_attention, flow.steer_session ]
  - surface: surface.ws_api
    summary: Validate and dispatch the WorkItem command family into the durable service.
    files: [ server/commands/work-items.ts, server/work-item-service.ts, shared/work-item-contracts.ts ]
    tests: [ server/commands/work-items.test.ts, server/work-item-service-sqlite.test.ts, tests/contracts/work-item-contracts.test.ts ]
    flows: [ flow.steer_session ]
freshness:
  class: code_coupled
risk: critical
domain: domain.execution_lifecycle
depends_on: []
bridges:
  - to: flow.recover_after_disconnect
    reason: Durable work-item surfaces restore state through the observability-owned reconnect flow.
  - to: flow.triage_attention
    reason: Durable work-item surfaces expose canonical records to the observability-owned attention triage flow.

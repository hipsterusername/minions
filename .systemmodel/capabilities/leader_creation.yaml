id: capability.leader_creation
type: capability
name: Leader creation and iterations
summary: Users can launch a configured Leader from canvas, mobile, or activity and start or resume durable iterations through the correct ingress.
constraints: []
decisions: [ decision.canonical_work_item_lifecycle, decision.role_gated_agent_tools ]
risks:
  - risk.dual_ingress_divergence
suggested_files: [ src/nodes/LeaderNode.tsx, src/nodes/leader/work-item.ts, server/commands/work-items.ts, server/commands/create-session.ts, server/session-launch.ts ]
suggested_tests: [ src/nodes/LeaderNode.session-init.test.tsx, src/nodes/leader/work-item.test.ts, server/commands/work-items.test.ts, server/commands/create-session.test.ts, server/session-launch.test.ts ]
keywords: [ leader, create, launch, start, resume, iteration, intention, prompt, work_item, session, run, empty_canvas, activity, mobile ]
entry_points:
  - surface: surface.canvas
    summary: Create a Leader node, bind a WorkItem, deliver canvas context, and start its canonical run.
    files: [ src/Canvas.tsx, src/nodes/LeaderNode.tsx, src/nodes/leader/use-canvas-work-item.ts, src/nodes/leader/work-item.ts ]
    tests: [ src/empty-canvas.test.ts, src/nodes/LeaderNode.session-init.test.tsx, src/nodes/leader/work-item.test.ts ]
    flows: [ flow.launch_leader, flow.steer_session ]
  - surface: surface.mobile
    summary: Launch a configured remote Leader session and open its chat.
    files: [ src/mobile/LaunchScreen.tsx, src/mobile/MobileApp.tsx ]
    tests: [ src/mobile/LaunchScreen.test.tsx, src/mobile/MobileApp.test.tsx ]
    flows: [ flow.launch_leader, flow.steer_session ]
  - surface: surface.activity
    summary: Open the embedded launch experience or start a new canonical iteration from triage.
    files: [ src/ActivityView.tsx, src/nodes/leader/ActivityLaunchForm.tsx ]
    tests: [ src/ActivityView.test.tsx, src/nodes/LeaderNode.session-init.test.tsx ]
    flows: [ flow.launch_leader, flow.steer_session ]
  - surface: surface.ws_api
    summary: Validate and execute canonical WorkItem commands or explicit bare create_session ingress.
    files: [ server/commands/work-items.ts, server/commands/create-session.ts, server/session-launch.ts ]
    tests: [ server/commands/work-items.test.ts, server/commands/create-session.test.ts, server/session-launch.test.ts ]
    flows: [ flow.launch_leader ]
freshness:
  class: code_coupled
risk: critical
domain: domain.execution_lifecycle
depends_on:
  - capability.durable_work_items
bridges: []

id: capability.worktree_approval
type: capability
name: Worktree Approval And Merge
summary: Isolated leader worktrees collect code changes for review expose diffs to the UI and only merge or discard through explicit WS commands that update session state and cleanup the worktree branch.
linked_flows:
  - flow.create_session_worktree
  - flow.load_worktree_diff
  - flow.approve_changes
  - flow.merge_worktree
  - flow.force_merge
  - flow.retry_merge
  - flow.discard_worktree
constraints:
  - constraint.review_gated_merges
  - constraint.bus_only_broadcasts
decisions:
  - decision.worktree_isolation
  - decision.graph_as_bus
risks:
  - risk.merge_bypass
  - risk.parallel_work_conflicts
  - risk.command_contract_drift
  - risk.session_state_drift
suggested_files:
  - server/worktree.ts
  - server/worktree-create.ts
  - server/worktree-merge.ts
  - server/worktree-diff.ts
  - server/commands/helpers.ts
  - server/commands/approve-changes.ts
  - server/commands/merge-worktree.ts
  - src/ChangesView.tsx
suggested_tests:
  - server/worktree-create.test.ts
  - server/worktree-diff.test.ts
  - server/worktree-merge.test.ts
  - server/commands/merge-flow.test.ts
  - server/commands/merge-worktree.test.ts
  - tests/contracts/merge-blocking.test.ts
  - src/ChangesView.test.tsx
keywords:
  - worktree
  - approval
  - approve_changes
  - merge_worktree
  - force_merge
  - retry_merge
  - discard_worktree
  - get_worktree_diff
  - update-ref
  - merge gate
freshness:
  class: code_coupled
risk: high

id: capability.task_delegation
type: capability
name: Task Delegation And Minions
summary: Leader MCP tools register tasks, spawn minion sessions, steer live children, project server owned task lifecycle state, and receive structured minion reports for UI and status surfaces.
linked_flows:
  - flow.delegate_work_to_minion
  - flow.steer_and_handoff_work
  - flow.prepare_scoped_work_packet
constraints:
  - constraint.bus_only_broadcasts
  - constraint.no_cross_tree_imports
  - constraint.model_bloat_guard
  - constraint.server_file_size_ceiling
decisions:
  - decision.graph_as_bus
  - decision.worktree_isolation
  - decision.relevance_scoped_context
risks:
  - risk.command_contract_drift
  - risk.render_schema_drift
  - risk.session_state_drift
  - risk.parallel_work_conflicts
  - risk.prompt_bloat
  - risk.model_rot
suggested_files:
  - server/task-tools.ts
  - server/task-tools/assign-task.ts
  - server/task-lifecycle.ts
  - server/minion-tools.ts
  - server/subskill-tools.ts
  - server/task-tools/task-prompt.ts
  - shared/prompts/minion-system.ts
  - src/nodes/leader/TaskPlanPanel.tsx
suggested_tests:
  - server/task-tools/plan-task.test.ts
  - server/task-tools/assign-task.test.ts
  - server/task-lifecycle.test.ts
  - server/minion-tools.test.ts
  - server/agents/minion.test.ts
  - server/task-tools/message-task.test.ts
  - tests/architecture/task-lifecycle-authority.test.ts
keywords:
  - task_manager
  - leader_tools
  - minion
  - delegation
  - task_lifecycle
  - mcp_tools
  - task_plan_update
  - minion_status
freshness:
  class: code_coupled
risk: high

id: capability.context_routing
type: capability
name: Context routing
summary: Users and Leaders can turn workspace-owned project knowledge and connected artifacts into bounded, freshness-aware agent input, including progressive skill retrieval from immutable run catalogs.
constraints: []
decisions: [ decision.typed_event_bus ]
risks:
  - risk.project_worktree_content_split
suggested_files: [ shared/project-context.ts, src/connected-context.ts, src/context-extraction.ts, src/context-delivery.ts, server/commands/canvas-context.ts, server/task-tools/update-project-context.ts, server/task-tools/task-prompt.ts ]
suggested_tests: [ src/ProjectPanel.test.tsx, src/connected-context.test.ts, src/context-extraction.test.ts, src/context-delivery.test.ts, src/context-staleness.test.ts, server/task-tools/update-project-context.test.ts, server/task-tools/task-prompt.test.ts ]
keywords: [ context, graph, routing, provider, attachment, canvas_context, stale, snapshot, file, image, markdown, ordering ]
entry_points:
  - surface: surface.canvas
    summary: Connect providers through graph ports and inspect or publish their extracted context.
    files: [ src/Canvas.tsx, src/connected-context.ts, src/context-extraction.ts, src/ProjectPanel.tsx ]
    tests: [ src/connected-context.test.ts, src/context-extraction.test.ts, src/ProjectPanel.test.tsx ]
    flows: [ flow.route_canvas_context, flow.save_project_knowledge ]
  - surface: surface.agent_tools
    summary: Let Leaders replace workspace-owned context and freeze configured context into delegation; Leaders and Minions load parent skills, sub-skills, and paged attachments from the same persisted skill snapshot used for prompts.
    files: [ server/task-tools/update-project-context.ts, server/task-tools/task-prompt.ts, server/task-tools/assign-task.ts, shared/skill-prompt.ts, server/skill-retrieval.ts, server/skill-snapshot.ts, server/task-graph/planning-source.ts ]
    tests: [ server/task-tools/update-project-context.test.ts, server/task-tools/task-prompt.test.ts, server/task-tools/assign-task.test.ts, server/skill-retrieval.test.ts, tests/contracts/skill-retrieval.test.ts, server/task-graph/planning-source.test.ts ]
    flows: [ flow.save_project_knowledge, flow.route_canvas_context, flow.delegate_and_steer_minions ]
  - surface: surface.ws_api
    summary: Deliver a complete context snapshot to SessionHost before execution.
    files: [ server/commands/canvas-context.ts, server/canvas-context-store.ts ]
    tests: [ tests/contracts/canvas-context.test.ts, src/context-delivery.test.ts ]
    flows: [ flow.route_canvas_context ]
freshness:
  class: code_coupled
risk: high
domain: domain.workspace
depends_on:
  - capability.project_workspace
bridges:
  - to: flow.delegate_and_steer_minions
    reason: The agent-tools entry point freezes workspace-owned context into delegation-owned task prompts.

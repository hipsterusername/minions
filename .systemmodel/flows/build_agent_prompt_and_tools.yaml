id: flow.build_agent_prompt_and_tools
type: flow
name: build_agent_prompt_and_tools
summary: Builds AgentTypeContext, role specific system prompts, MCP tool groups, allowed tool names, and normalized HarnessStartOptions for leader and minion sessions.
capabilities:
  - capability.canvas_sessions
constraints:
  - constraint.no_cross_tree_imports
  - constraint.model_bloat_guard
  - constraint.server_file_size_ceiling
decisions:
  - decision.relevance_scoped_context
  - decision.worktree_isolation
risks:
  - risk.prompt_bloat
  - risk.command_contract_drift
  - risk.session_state_drift
suggested_files:
  - server/session-host-run.ts
  - server/agents/types.ts
  - server/agents/leader.ts
  - server/agents/minion.ts
  - server/session-host-config.ts
  - server/harness/types.ts
suggested_tests:
  - server/session-host-run.test.ts
  - server/session-host.harness-flow.test.ts
  - server/agents/leader.test.ts
  - server/agents/minion.test.ts
steps:
  - buildAgentContext exposes session identity cwd bus worktree metadata existing task and render state skill ids runtime lookup minion spawning wait scheduling termination message injection and wake callbacks.
  - Leader getToolGroups requires minion and wait callbacks, creates task manager and render dashboard tools, conditionally adds system model tools, and gates skill authoring tools on skill-builder.
  - Minion getToolGroups finds its parent task, wires minion status reporting to parent task lifecycle events, always exposes subskill loading, and gates skill authoring tools on armed task skills.
  - buildHarnessStartOpts combines harness built ins, agent MCP names, derived tool group names, and external MCP names into allowedTools.
  - The role system prompt is built from the AgentType and optionally enriched for worktree context, then normalized with model permission mode thinking config attachments resumeId abort signal and external MCP servers.
freshness:
  class: code_coupled
risk: high

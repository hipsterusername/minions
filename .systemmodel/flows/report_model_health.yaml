id: flow.report_model_health
type: flow
name: Report Model Health and Overbreadth
summary: Reports unused stale orphaned and overbroad model objects then derives prune recommendations from usage graph freshness and coverage signals.
capabilities:
  - capability.system_model_layer
constraints:
  - constraint.model_bloat_guard
decisions:
  - decision.graph_as_bus
  - decision.relevance_scoped_context
risks:
  - risk.model_rot
  - risk.prompt_bloat
suggested_files:
  - shared/system-model/graph.ts
  - server/system-model/usage.ts
  - server/system-model/graph.ts
  - server/system-model/validate.ts
  - server/system-model/store.ts
  - server/system-model-tools/model-health.ts
suggested_tests:
  - shared/system-model/graph.test.ts
  - server/system-model/graph.test.ts
  - server/system-model/usage.test.ts
  - server/system-model/validate.test.ts
  - server/system-model-tools/model-health.test.ts
  - server/system-model/store.test.ts
steps:
  - Find objects unused in recent packets by combining packet usage rows and recent query usage rows.
  - Check capability and flow freshness with the same timestamp and policy logic used by packet compilation.
  - Project the loaded model into graph nodes and edges then flag objects with no inbound links as orphaned.
  - Run overbreadth computation against tracked files for review gate and constraint globs.
  - Merge unused stale and orphan reasons into deterministic prune recommendations.
freshness:
  class: code_coupled
risk: medium

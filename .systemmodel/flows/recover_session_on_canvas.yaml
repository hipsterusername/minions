id: flow.recover_session_on_canvas
type: flow
name: Recover A Session On The Canvas
summary: A reconnecting user recovers session status, buffered events, task and dashboard state, then continues receiving normalized live output.
capabilities: [capability.canvas_sessions, capability.persistence_project_state]
constraints: [constraint.bus_only_broadcasts, constraint.no_cross_tree_imports]
decisions: [decision.graph_as_bus, decision.relevance_scoped_context]
risks: [risk.session_state_drift, risk.render_schema_drift]
suggested_files: [server/session-persist.ts, server/session-host.ts, src/session-stream.ts, src/nodes/LeaderNode.tsx]
suggested_tests: [server/session-persist.test.ts, server/session-host.test.ts, src/session-stream.test.ts]
steps:
  - Rehydrate persisted session shells and request a scoped synchronization snapshot.
  - Rebuild messages, tasks, render state, worktree metadata, and controls without duplicate events.
  - Apply normalized live events and streaming previews as the session continues.
freshness:
  class: code_coupled
risk: high

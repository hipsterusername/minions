id: flow.skill_authoring_delete_tool
type: flow
name: Delete Project Skill
summary: delete_skill removes only project-scoped skills from the sidecar while built-in presets cannot be deleted and reappear after override removal.
capabilities:
  - capability.skill_library
constraints:
  - constraint.no_cross_tree_imports
  - constraint.server_file_size_ceiling
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.command_contract_drift
  - risk.model_rot
suggested_files:
  - server/skill-authoring-tools.ts
  - server/skill-authoring.ts
  - server/project-store.ts
  - shared/skill-presets.ts
  - server/skill-authoring-tools.test.ts
suggested_tests:
  - server/skill-authoring-tools.test.ts
  - server/skill-authoring.test.ts
steps:
  - delete_skill parses the target id.
  - removeSkillFromArray filters only raw sidecar entries that pass isRawSkill and match the id.
  - If nothing was removed, the tool returns an error explaining that non-project built-ins are not deletable.
  - Removed project entries are written back with writeSkills.
  - If the removed id shadowed a shared built-in, future merged reads surface the built-in again.
freshness:
  class: code_coupled
risk: medium

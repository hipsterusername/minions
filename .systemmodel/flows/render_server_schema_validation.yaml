id: flow.render_server_schema_validation
type: flow
name: server validates the component schema contract
summary: The server exposes object shaped MCP input schemas but gates all render state mutation through the canonical shared discriminated union and recursive container validation.
capabilities:
  - capability.render_dashboard
constraints:
  - constraint.no_cross_tree_imports
  - constraint.server_file_size_ceiling
  - constraint.model_bloat_guard
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.render_schema_drift
  - risk.command_contract_drift
  - risk.prompt_bloat
suggested_files:
  - server/render-tools.ts
  - shared/render-dsl.ts
  - shared/render-form.ts
  - shared/render-chart.ts
  - shared/render-containers.ts
  - shared/render-artifacts.ts
suggested_tests:
  - server/render-tools.test.ts
  - server/mcp-bridge/dispatch.test.ts
  - tests/contracts/render-dsl-roundtrip.test.ts
  - shared/render-dsl.test.ts
  - shared/render-containers.test.ts
  - shared/render-chart.test.ts
  - shared/render-artifacts.test.ts
steps:
  - renderComponentInputSchema exposes id and type as a compact loose object so schema limited MCP adapters still show components as JSON objects.
  - renderComponentSchema remains the canonical strict discriminated union for all component variants.
  - server render tools parses every accepted input component through renderComponentSchema before mutating renderState.
  - parseRenderComponent recursively validates section components and tabs tab components compensating for the loose child schema in shared render containers.
  - server and MCP bridge tests reject stringified component payloads and assert tool schema exposure stays object based.
freshness:
  class: code_coupled
risk: high

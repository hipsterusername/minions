id: flow.persist_project_workspace
type: flow
name: Persist A Project Workspace
summary: A user returns to a project with its canvas, context, settings, skills, and MCP configuration restored from durable sidecar storage.
capabilities: [capability.persistence_project_state]
constraints: [constraint.no_cross_tree_imports, constraint.server_file_size_ceiling, constraint.model_bloat_guard]
decisions: []
risks: [risk.session_state_drift, risk.command_contract_drift]
suggested_files: [server/db.ts, server/project-store.ts, server/routes/projects/core.ts, server/routes/projects/settings.ts]
suggested_tests: [server/db.test.ts, server/project-store.test.ts, tests/contracts/projects-core-routes.test.ts, tests/contracts/projects-settings-routes.test.ts]
steps:
  - Initialize or migrate the project sidecar without losing existing data.
  - Save canvas transform, nodes, edges, context, settings, skills, and MCP configuration.
  - Reload the same workspace state when the project is opened again.
freshness:
  class: code_coupled
risk: high

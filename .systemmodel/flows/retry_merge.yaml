id: flow.retry_merge
type: flow
name: Retry Merge After Conflict Resolution
summary: retry_merge reruns the normal gated approval merge after a previous conflict so manually resolved worktree changes can be merged without a force strategy.
capabilities:
  - capability.worktree_approval
constraints:
  - constraint.review_gated_merges
  - constraint.bus_only_broadcasts
decisions:
  - decision.worktree_isolation
  - decision.graph_as_bus
risks:
  - risk.parallel_work_conflicts
  - risk.session_state_drift
  - risk.command_contract_drift
suggested_files:
  - server/commands/retry-merge.ts
  - server/commands/helpers.ts
  - server/worktree-merge.ts
  - server/worktree-create.ts
  - server/worktree.ts
suggested_tests:
  - server/commands/merge-flow.test.ts
  - server/worktree-merge.test.ts
  - tests/contracts/merge-blocking.test.ts
steps:
  - A previous merge failure leaves host.worktree attached and reports conflicts in worktree_merge_failed.
  - After external or manual resolution retry_merge validates the same session and worktree preconditions.
  - runMergeFlow evaluates merge gates and blocks when enforced review state still denies merging.
  - mergeAndCleanup reruns the clean merge path without force options including auto-commit merge or rebase fallback safe update-ref and cleanup on success.
  - Success completes the session like approve_changes while failure emits worktree_merge_failed and leaves the worktree active for another retry or discard.
freshness:
  class: code_coupled
risk: high

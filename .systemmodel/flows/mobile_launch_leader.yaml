id: flow.mobile_launch_leader
type: flow
name: Mobile Launch Leader Session
summary: Mobile launch chooses project, prompt, model, harness, attachments, skills, and worktree isolation, then sends create_session for a leader and opens the new session.
capabilities:
  - capability.canvas_ui
constraints:
  - constraint.review_gated_merges
decisions:
  - decision.worktree_isolation
risks:
  - risk.command_contract_drift
  - risk.session_state_drift
suggested_files:
  - src/mobile/MobileApp.tsx
  - src/mobile/LaunchScreen.tsx
  - src/mobile/LaunchSkillsPanel.tsx
  - src/mobile/launch-models.ts
  - src/mobile/attachments.ts
  - src/mobile/mobile.css
suggested_tests:
  - src/mobile/MobileApp.test.tsx
  - src/mobile/LaunchScreen.test.tsx
  - src/mobile/LaunchSkillsPanel.test.tsx
  - src/mobile/launch-models.test.ts
  - src/mobile/attachments.test.ts
steps:
  - MobileApp opens LaunchScreen inside the selected project scope or passes no locked project so LaunchScreen fetches recent projects.
  - LaunchScreen loads harness models through useHarnessList, builds grouped encoded harness model options, and parses the selected option back into model and harness.
  - The screen loads project skills, lets users select skills and variable values, and freezes the leader system prompt only when a skill is armed.
  - File input accepts supported images and text files while images become attachment payloads and text attachments are appended to the prompt.
  - Submit generates a leader sessionKey and sends create_session with role leader, cwd, prompt, optional worktreeIsolation, attachments, model, harness, and skills.
  - onLaunched records the pending session and opens mobile chat while MobileApp clears the pending marker on session_created or routes to Activity on a session limit error.
freshness:
  class: code_coupled
risk: high

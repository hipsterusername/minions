id: flow.steer_and_handoff_work
type: flow
name: Steer Work And Hand Off Safely
summary: A leader inspects delegated work, sends targeted guidance, and checkpoints its own session only when outstanding interaction can resume safely.
capabilities: [capability.task_delegation]
constraints: [constraint.model_bloat_guard, constraint.review_gated_merges]
decisions: [decision.graph_as_bus]
risks: [risk.session_state_drift, risk.command_contract_drift]
suggested_files: [server/task-tools/message-task.ts, server/task-tools/get-task-status.ts, server/session-checkpoint.ts]
suggested_tests: [server/task-tools/message-task.test.ts, server/task-tools/get-task-status.test.ts, server/session-checkpoint.test.ts]
steps:
  - Inspect compact or detailed status for the active task plan.
  - Send focused steering to a live minion when its direction must change.
  - Hand off the leader only when approval, child waits, and pending forms are at a safe boundary.
freshness:
  class: code_coupled
risk: medium

id: flow.create_canvas_session
type: flow
name: create_canvas_session
summary: Handles create_session validation, registry start, host launch, session acknowledgement, and session list refresh for a new canvas session.
capabilities:
  - capability.canvas_sessions
constraints:
  - constraint.bus_only_broadcasts
  - constraint.no_cross_tree_imports
  - constraint.server_file_size_ceiling
decisions:
  - decision.graph_as_bus
  - decision.worktree_isolation
risks:
  - risk.command_contract_drift
  - risk.session_state_drift
suggested_files:
  - server/commands/create-session.ts
  - server/commands/types.ts
  - server/session-registry.ts
  - server/session-host.ts
  - server/session-host-run.ts
  - server/bus.ts
suggested_tests:
  - server/commands/create-session.test.ts
  - server/session-registry.test.ts
  - tests/contracts/ws-command-validation.test.ts
  - tests/contracts/ws-envelope.test.ts
steps:
  - create_session derives or accepts sessionKey and treats duplicate caller supplied keys as idempotent session_created acknowledgements.
  - The command enforces active session capacity, validates cwd, sanitizes attachments, validates thinking config, and rejects unknown harness names with session scoped errors when possible.
  - SessionRegistry.start creates or reuses a SessionHost and fire and forgets host.start with validated StartSessionOptions.
  - The command emits a global session_list snapshot and unicasts session_created to the session topic.
  - SessionHost.start resets per run state, seeds role model harness permission thinking and worktree flags, provisions worktree state when required, persists the host boundary snapshot, and emits session_status running.
freshness:
  class: code_coupled
risk: high

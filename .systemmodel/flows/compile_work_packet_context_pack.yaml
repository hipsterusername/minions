id: flow.compile_work_packet_context_pack
type: flow
name: Compile Work Packet Context Pack
summary: Creates and persists a scoped Work Packet with linked model context freshness results gate requirements and a bounded context pack.
capabilities:
  - capability.system_model_layer
constraints:
  - constraint.model_bloat_guard
  - constraint.review_gated_merges
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.prompt_bloat
  - risk.model_rot
  - risk.merge_bypass
suggested_files:
  - server/system-model-tools/create-work-packet.ts
  - server/system-model/compile.ts
  - server/system-model/match.ts
  - server/system-model/freshness.ts
  - server/system-model/applicability.ts
  - server/system-model/store.ts
suggested_tests:
  - server/system-model-tools/create-work-packet.test.ts
  - server/system-model/compile.test.ts
  - server/system-model/match.test.ts
  - server/system-model/freshness.test.ts
  - server/system-model/applicability.test.ts
  - server/system-model/store.test.ts
steps:
  - Prefilter request text and files then prefer leader confirmed capability or flow ids when supplied.
  - Expand selected capabilities and flows into constraints decisions risks suggested files suggested tests and agent instructions.
  - Run freshness checks for code coupled capabilities and flows and copy warnings and required verifications into the packet.
  - Derive packet required state and review gate requirements from expanded files capabilities and flows.
  - Render the context pack with the safety preamble low confidence fallback per object trimming and omission markers.
  - Save the packet and context pack record packet usage and emit the work packet created event.
freshness:
  class: code_coupled
risk: high

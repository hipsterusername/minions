id: flow.retry_terminal_task
type: flow
name: Retry Failed Or Orphaned Task
summary: assign_task can reuse a taskId for retryable terminal states and create a new minion attempt while preserving previous attempt status, result, and completion lineage.
capabilities:
  - capability.task_delegation
constraints:
  - constraint.bus_only_broadcasts
decisions:
  - decision.graph_as_bus
risks:
  - risk.session_state_drift
  - risk.parallel_work_conflicts
suggested_files:
  - server/task-tools/assign-task.ts
  - server/task-lifecycle.ts
  - server/task-tools/get-task-status.ts
  - server/task-tools/types.ts
suggested_tests:
  - server/task-tools/assign-task.test.ts
  - server/task-lifecycle.test.ts
  - server/task-tools/get-task-status.test.ts
steps:
  - Reject starting or running tasks as already active and reject completed tasks with guidance to create a new task.
  - Treat failed, ended_without_report, orphaned, and cancelled as retryable terminal statuses.
  - Update task metadata from the retry request, generate a fresh minion session key, and apply assigned.
  - The lifecycle reducer resets result and completedAt, moves status to starting, increments attempt, and appends prior attempt details to previousAttempts.
  - The tool schedules a fresh timeout, starts the new minion session, emits minion_spawned, and notes the attempt number in result text.
freshness:
  class: code_coupled
risk: medium

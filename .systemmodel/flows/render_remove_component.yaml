id: flow.render_remove_component
type: flow
name: render_remove deletes components by id
summary: The leader submits ids to remove and server plus client both filter those ids from the render component list.
capabilities:
  - capability.render_dashboard
constraints:
  - constraint.bus_only_broadcasts
  - constraint.no_cross_tree_imports
decisions:
  - decision.graph_as_bus
risks:
  - risk.session_state_drift
  - risk.command_contract_drift
suggested_files:
  - server/render-tools.ts
  - shared/render-dsl.ts
  - src/nodes/RenderNode.tsx
  - tests/contracts/render-dsl-roundtrip.test.ts
  - server/render-tools.test.ts
suggested_tests:
  - tests/contracts/render-dsl-roundtrip.test.ts
  - server/render-tools.test.ts
  - shared/render-dsl.test.ts
steps:
  - renderRemoveInputSchema requires ids as an array of strings.
  - server render tools builds an id set and filters matching components out of renderState.components.
  - the server emits a render_update action remove envelope with the ids.
  - RenderNode validates the remove message with renderMessageSchema.
  - applyRenderMessage filters the same ids out of client state.
freshness:
  class: code_coupled
risk: medium

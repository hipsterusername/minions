id: flow.prepare_scoped_work_packet
type: flow
name: Prepare A Scoped Work Packet
summary: A leader turns a gated file scope into a bounded Work Packet that gives an assigned agent the relevant context, constraints, freshness state, and review requirements.
capabilities: [capability.system_model_layer, capability.task_delegation]
constraints: [constraint.model_bloat_guard, constraint.review_gated_merges]
decisions: [decision.relevance_scoped_context]
risks: [risk.prompt_bloat, risk.model_rot, risk.parallel_work_conflicts]
suggested_files: [server/system-model/applicability.ts, server/system-model/compile.ts, server/system-model-tools/create-work-packet.ts, server/system-model-tools/amend-work-packet.ts]
suggested_tests: [server/system-model/applicability.test.ts, server/system-model/compile.test.ts, server/system-model-tools/create-work-packet.test.ts]
steps:
  - Detect whether planned files intersect a gate or critical constraint that requires a packet.
  - Compile a token-bounded packet from the task scope and directly relevant model objects.
  - Attach the packet to delegated work and amend it when replanning materially changes scope.
freshness:
  class: code_coupled
risk: high

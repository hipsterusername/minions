id: flow.open_project_workspace
type: flow
name: Open or recover a project workspace
summary: A user selects a registered project, loads persisted spatial state, connects live services, and reconciles sessions and work items without duplicate execution.
constraints: []
decisions: [ decision.typed_event_bus, decision.canonical_work_item_lifecycle ]
suggested_files: [ src/ProjectList.tsx, src/App.tsx, src/ProjectHeader.tsx, src/mobile/ProjectsScreen.tsx, src/use-work-items.ts ]
suggested_tests: [ src/ProjectList.test.tsx, src/App.dom.test.tsx, src/api.test.ts, src/use-autosave.test.tsx, src/canvas-work-item-reconcile.test.ts ]
steps:
  - Resolve a registered project and load its nodes, graph, transform, settings, skills, and sidecar state.
  - Connect WebSocket services and issue list_sessions, list_work_items, and list_worktree_lineages.
  - Reconcile persisted surface bindings and sync mounted sessions from authoritative host snapshots.
  - Expose readiness or autosave failures for explicit retry without launching duplicate runs.
freshness:
  class: code_coupled
risk: high
domain: domain.workspace
primary_capability: capability.project_workspace
bridges: []
risks: []

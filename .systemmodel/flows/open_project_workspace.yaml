id: flow.open_project_workspace
type: flow
name: Open or recover a project workspace
summary: A user explicitly registers a source folder, receives a stable workspace UUID, and loads central state before reconciling sessions and work items.
constraints: []
decisions: [ decision.typed_event_bus, decision.canonical_work_item_lifecycle, decision.portable_workspace_roots ]
suggested_files: [ src/ProjectList.tsx, src/App.tsx, src/ProjectHeader.tsx, src/mobile/ProjectsScreen.tsx, src/use-work-items.ts, server/workspace-registry.ts, server/routes/projects/core.ts ]
suggested_tests: [ src/ProjectList.test.tsx, src/App.dom.test.tsx, src/api.test.ts, src/use-autosave.test.tsx, src/canvas-work-item-reconcile.test.ts, server/workspace-registry.test.ts, tests/contracts/projects-core-routes.test.ts ]
steps:
  - Canonicalize an explicitly opened source root, including mounted-volume paths, and bind it to a stable UUID.
  - Resolve state from MINIONS_HOME/workspaces/<uuid>, non-destructively importing a legacy .minions sidecar on first registration.
  - Load nodes, graph, transform, settings, skills, and project knowledge from the bound state root.
  - Connect WebSocket services and issue list_sessions, list_work_items, and list_worktree_lineages.
  - Reconcile persisted surface bindings and sync mounted sessions from authoritative host snapshots.
  - Expose readiness or autosave failures for explicit retry without launching duplicate runs.
freshness:
  class: code_coupled
risk: high
domain: domain.workspace
primary_capability: capability.project_workspace
bridges: []
risks: [ risk.legacy_workspace_root_overlap ]

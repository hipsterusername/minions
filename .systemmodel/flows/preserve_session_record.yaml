id: flow.preserve_session_record
type: flow
name: Preserve A Session Record
summary: A user can leave and return without losing stable session metadata, buffered conversation events, dashboard state, or deduplicated usage totals.
capabilities: [capability.persistence_project_state, capability.canvas_sessions, capability.render_dashboard]
constraints: [constraint.bus_only_broadcasts, constraint.no_cross_tree_imports, constraint.server_file_size_ceiling]
decisions: [decision.graph_as_bus, decision.worktree_isolation]
risks: [risk.session_state_drift, risk.render_schema_drift]
suggested_files: [server/session-persist.ts, server/session-repo.ts, server/session-message.ts, server/session-usage-capture.ts]
suggested_tests: [server/session-persist.test.ts, server/session-repo.test.ts, server/session-usage-capture.test.ts]
steps:
  - Persist stable session metadata and a bounded event history as activity occurs.
  - Store dashboard mutations and deduplicated harness usage records.
  - Hydrate stopped session shells, event history, dashboard state, and aggregate totals on restart.
freshness:
  class: code_coupled
risk: high

id: flow.skill_authoring_update_override_tool
type: flow
name: Update Skill Or Built-In Override
summary: update_skill patches an existing project or built-in skill by id, preserving unspecified fields and writing built-in edits as project overrides.
capabilities:
  - capability.skill_library
constraints:
  - constraint.no_cross_tree_imports
  - constraint.server_file_size_ceiling
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.command_contract_drift
  - risk.model_rot
suggested_files:
  - server/skill-authoring-tools.ts
  - server/skill-authoring.ts
  - server/skills.ts
  - server/project-store.ts
  - shared/skill-presets.ts
  - server/skill-authoring-tools.test.ts
suggested_tests:
  - server/skill-authoring-tools.test.ts
  - server/skill-authoring.test.ts
  - server/skills.test.ts
steps:
  - update_skill parses a required id plus a partial draft patch.
  - The base skill is resolved from loadAllSkills so both project skills and shared built-ins can be patched.
  - buildSkillDraft merges the patch onto the base, preserves omitted fields, and recomputes implicit variables.
  - upsertSkillInArray replaces an existing project entry or appends a same-id project override for a built-in preset.
  - The updated raw sidecar is persisted through writeSkills.
freshness:
  class: code_coupled
risk: high

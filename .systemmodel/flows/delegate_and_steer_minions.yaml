id: flow.delegate_and_steer_minions
type: flow
name: Delegate, monitor, and steer minions
summary: A Leader plans and assigns bounded child work, durably receives resumable progress and terminal reports, and is reliably woken to message, cancel, retry, synthesize, or wait.
constraints: [ constraint.minion_lifecycle_semantics ]
decisions: [ decision.role_gated_agent_tools, decision.typed_event_bus ]
risks:
  - risk.agent_tool_allowlist_drift
suggested_files: [ server/agents/leader.ts, server/agents/minion.ts, server/task-tools/assign-task.ts, server/task-tools/task-prompt.ts, server/minion-tools.ts, server/agents/leader-teardown.ts, server/session-registry.ts, server/leader-wake.ts, server/session-persist.ts, server/session-task-state-persist.ts, server/wake-coalescer.ts, server/wait-resume.ts ]
suggested_tests: [ server/agents/leader.test.ts, server/agents/minion.test.ts, server/task-tools/assign-task.test.ts, server/task-tools/task-prompt.test.ts, server/minion-tools.test.ts, server/session-registry.test.ts, server/session-persist.test.ts, server/wake-coalescer.test.ts ]
steps:
  - Plan a stable task ID before assignment and freeze configured Minions project context, executor, harness, owned paths, skills, and work packet into the child prompt.
  - Start the child session and publish progress to both child and Leader topics.
  - Keep report_blocked resumable and make done, fail, and cancellation terminal transitions idempotent.
  - Persist the complete task snapshot and attention intent before requesting a Leader wake.
  - Keep waits and attention pending until continuation dispatch succeeds, then acknowledge them durably.
  - Message, retry, cancel, synthesize, or wait for early wake while preserving declared write-set visibility.
freshness:
  class: code_coupled
risk: high
domain: domain.delegation
primary_capability: capability.task_orchestration
bridges: []

id: flow.sqlite_schema_init_and_migration
type: flow
name: sqlite_schema_init_and_migration
summary: Initialize SQLite databases and apply idempotent migrations for durable project and session state.
capabilities:
  - capability.persistence_project_state
constraints:
  - constraint.server_file_size_ceiling
  - constraint.no_cross_tree_imports
  - constraint.model_bloat_guard
decisions: []
risks:
  - risk.session_state_drift
  - risk.model_rot
suggested_files:
  - server/db.ts
  - server/db.test.ts
suggested_tests:
  - pnpm test:run -- server/db.test.ts
steps:
  - Resolve the database path from the caller, environment, or default data directory.
  - Create the parent directory, open better sqlite, enable WAL mode, and enforce foreign keys.
  - Create all public persistence tables with create table if not exists.
  - Add legacy columns for sessions, worktree metadata, harness names, usage identity, and context packs.
  - Rebuild task and system model usage tables only when primary key shape is legacy.
  - Add indexes and clear pre normalized event log rows during the schema version migration.
freshness:
  class: code_coupled
risk: high

id: flow.context_group_create_select_and_resolve
type: flow
name: Organize Canvas Context
summary: A user groups related context nodes spatially, moves and selects them together, and supplies the resolved group as context to agent work.
capabilities: [capability.canvas_ui]
constraints: [constraint.model_bloat_guard]
decisions: [decision.relevance_scoped_context]
risks: [risk.prompt_bloat]
suggested_files: [src/Canvas.tsx, src/nodes/ContextGroupNode.tsx, src/context-registry.ts]
suggested_tests: [src/canvas-utils.test.ts, src/nodes/ContextGroupNode.test.tsx, src/context-registry.test.ts]
steps:
  - Frame selected context nodes as a named group.
  - Preserve membership while the group is moved, resized, or auto-fitted.
  - Resolve registered provider content when the group is attached to an agent request.
freshness:
  class: code_coupled
risk: medium

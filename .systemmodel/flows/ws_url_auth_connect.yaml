id: flow.ws_url_auth_connect
type: flow
name: WebSocket URL And Auth Connect
summary: Browser builds a same-origin WebSocket URL, appends an auth token, and the server verifies the token before accepting the socket.
capabilities:
  - capability.ws_command_bus
constraints:
  - constraint.no_cross_tree_imports
decisions: []
risks: []
suggested_files:
  - src/ws-url.ts
  - src/api.ts
  - src/use-socket.ts
  - server/index.ts
suggested_tests:
  - src/ws-url.test.ts
  - src/use-socket.test.tsx
steps:
  - buildWsUrl chooses ws or wss from window.location.protocol and returns the same-origin /ws endpoint without hardcoding the backend port.
  - useSocket calls getAuthToken before constructing a WebSocket and appends token as either question-token or ampersand-token depending on the URL.
  - server/index.ts reads the token query parameter during WebSocket verification and rejects connections whose token does not match AUTH_TOKEN.
  - After token verification, the server connection handler delegates the accepted socket to attachConnectionListeners.
freshness:
  class: code_coupled
risk: medium

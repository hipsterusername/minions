id: flow.apply_theme_and_skin
type: flow
name: Personalize The Canvas
summary: A user chooses a visual theme or skin and sees that preference applied consistently and restored on the next visit.
capabilities: [capability.canvas_ui]
constraints: []
decisions: []
risks: []
suggested_files: [src/themes.ts, src/use-theme.ts, src/skins.css]
suggested_tests: [src/themes.test.ts, src/use-theme.test.ts]
steps:
  - Choose a theme from the available picker metadata.
  - Apply its variables, data attributes, and optional scoped skin.
  - Persist the selection and restore it when the app loads again.
freshness:
  class: code_coupled
risk: low

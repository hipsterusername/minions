id: flow.connection_snapshot_attach
type: flow
name: Connection Snapshot Attach
summary: A newly accepted socket is wired with listeners and receives the current session list as an enveloped global unicast.
capabilities:
  - capability.ws_command_bus
constraints:
  - constraint.bus_only_broadcasts
decisions: []
risks:
  - risk.command_contract_drift
suggested_files:
  - server/index.ts
  - server/ws-connection.ts
  - server/bus.ts
  - shared/ws-envelope.ts
suggested_tests:
  - server/ws-connection.test.ts
  - tests/contracts/ws-command-validation.test.ts
steps:
  - server/index.ts constructs createBus, builds CommandContext, and passes snapshotSessions plus a dispatch closure to attachConnectionListeners.
  - attachConnectionListeners logs the connection and immediately calls unicastGlobal with type session_list and deps.snapshotSessions.
  - unicastGlobal wraps the payload with the global topic and sends JSON only if the socket is OPEN.
  - The connection installs an error listener so ws errors such as oversized frames do not crash the process.
  - The connection installs message and close listeners for command processing and disconnect logging.
freshness:
  class: code_coupled
risk: medium

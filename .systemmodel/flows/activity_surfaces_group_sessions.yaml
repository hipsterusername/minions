id: flow.activity_surfaces_group_sessions
type: flow
name: Activity Surfaces Group Sessions
summary: Desktop and mobile activity surfaces share session grouping semantics, hide top level minions, sort by recency and attention, and route sessions to canvas or chat actions.
capabilities:
  - capability.canvas_ui
constraints: []
decisions:
  - decision.worktree_isolation
risks:
  - risk.session_state_drift
suggested_files:
  - src/ActivityView.tsx
  - src/mobile/MobileApp.tsx
  - src/mobile/ActivityScreen.tsx
  - src/mobile/mobile-selectors.ts
  - src/mobile/mobile.css
  - src/activity.css
suggested_tests:
  - src/ActivityView.test.tsx
  - src/mobile/MobileApp.test.tsx
  - src/mobile/ActivityScreen.test.tsx
  - src/mobile/mobile-selectors.test.ts
steps:
  - MobileApp receives sessions from useSessionActivity and scopes lists to the selected project with sessionBelongsToProject.
  - ActivityScreen filters out minion roles, groups visible sessions with groupSessionsByActivity, renders notice banners, and opens chat through onOpenSession.
  - mobile-selectors classifies active, idle, and stopped statuses, highlights error or pending attention sessions, formats role labels, and sorts by activity.
  - ActivityView uses the same selectors on desktop, filters minions, indexes leader canvas nodes by sessionKey, and exposes canvas and session actions.
  - MobileApp coordinates tab selection, project selection, session limit notices, approvals count, review routing, push navigation, and reconnect state around activity.
freshness:
  class: code_coupled
risk: medium

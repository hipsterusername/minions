id: flow.capture_session_usage_cost
type: flow
name: capture_session_usage_cost
summary: Capture harness usage events, deduplicate replayed identities, persist rows, and hydrate aggregate totals.
capabilities:
  - capability.persistence_project_state
constraints:
  - constraint.no_cross_tree_imports
decisions: []
risks:
  - risk.session_state_drift
  - risk.model_rot
suggested_files:
  - server/session-host-run.ts
  - server/session-usage-capture.ts
  - server/session-persist.ts
  - server/usage-telemetry.ts
  - server/db.ts
  - server/session-usage-capture.test.ts
suggested_tests:
  - pnpm test:run -- server/session-usage-capture.test.ts server/usage-telemetry.test.ts server/db.test.ts
steps:
  - Route normalized usage events to captureUsageEvent before regular event buffering continues.
  - Derive a stable source and identity from message, turn, SDK session, role, model, and token fields.
  - Suppress exact duplicate usage replays and apply deltas when final values replace partial values.
  - Include assistant and turn completed rows in token totals while preserving result cost rows.
  - Insert or upsert session_usage rows using the unique identity index.
  - Reload aggregate usage totals and cache hit rate from persisted rows during hydration.
freshness:
  class: code_coupled
risk: high

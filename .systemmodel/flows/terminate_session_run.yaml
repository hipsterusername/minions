id: flow.terminate_session_run
type: flow
name: terminate_session_run
summary: Stops, closes, removes, or internally aborts a session run by clearing waits, closing harness control, marking stopped, broadcasting status, and applying role teardown.
capabilities:
  - capability.canvas_sessions
constraints:
  - constraint.bus_only_broadcasts
  - constraint.no_cross_tree_imports
  - constraint.server_file_size_ceiling
decisions:
  - decision.graph_as_bus
  - decision.worktree_isolation
risks:
  - risk.session_state_drift
  - risk.parallel_work_conflicts
  - risk.command_contract_drift
suggested_files:
  - server/commands/stop-session.ts
  - server/commands/close-session.ts
  - server/session-host.ts
  - server/session-host-terminate.ts
  - server/agents/leader.ts
  - server/agents/minion.ts
suggested_tests:
  - server/commands/stop-session.test.ts
  - server/commands/close-session.test.ts
  - server/session-host-terminate.test.ts
  - server/agents/leader.test.ts
  - server/agents/minion.test.ts
steps:
  - stop_session resolves the host and calls host.terminate with reason stop, while close_session uses reason close and returns a control_response.
  - terminateSessionHost clears wait timers, cancels queued wait resume, clears pendingWait task state, and emits wait_state cancelled when a timer existed.
  - For close or remove with runControl.close, orderly close is captured and awaited after synchronous teardown, otherwise runControl.abort is used before host.abortController is aborted.
  - The host is marked stopped, eventStream and runControl are nulled, state is persisted, and session_status stopped is buffered and emitted.
  - Minion termination propagates session_ended to the parent task lifecycle and may wake a waiting leader.
  - Agent onTerminate runs only for session termination, not normal done events, so leader teardown aborts running minion children on close or remove while leaving them alone for stop or abort.
freshness:
  class: code_coupled
risk: high

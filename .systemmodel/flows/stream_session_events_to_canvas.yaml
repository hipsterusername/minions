id: flow.stream_session_events_to_canvas
type: flow
name: stream_session_events_to_canvas
summary: Converts normalized harness events into canvas chat state with streaming previews, sub agent isolation, sync rebuilds, duplicate collapse, status updates, and node specific leader extras.
capabilities:
  - capability.canvas_sessions
constraints:
  - constraint.bus_only_broadcasts
  - constraint.no_cross_tree_imports
decisions:
  - decision.graph_as_bus
risks:
  - risk.render_schema_drift
  - risk.session_state_drift
  - risk.command_contract_drift
suggested_files:
  - server/session-host-run.ts
  - src/streaming.ts
  - src/sdk-messages.ts
  - src/session-stream.ts
  - src/use-session-stream.ts
  - src/nodes/ClaudeSessionNode.tsx
suggested_tests:
  - src/streaming.test.ts
  - src/sdk-messages.test.ts
  - src/session-stream.test.ts
  - src/nodes/ClaudeSessionNode.test.tsx
  - src/nodes/LeaderNode.test.tsx
  - tests/contracts/normalized-event.test.ts
steps:
  - Server side processNormalizedEvent wraps non control NormalizedEvent values as sdk_event and emits them to the session topic through the bus.
  - streaming.ts accepts only top level text_delta events, returns text plus blockIndex, drops sub agent deltas by parentId, and identifies stream_end.
  - sdk-messages.ts maps init assistant text thinking top level tool calls progress done results errors retry rate limit and permission denial into stable DisplayMessage objects while dropping usage deltas stream_end and tool_result.
  - sessionStreamReducer handles sync_response sdk_event session_status and session_error with reference equality bailouts, block boundary streaming resets, usage and done cost turn updates, and assistant result duplicate collapse.
  - useSessionStream subscribes to session topics, records debug messages, batches transient streaming only updates by animation frame, and leaves node specific fields to the caller.
  - ClaudeSessionNode still implements stream handling directly, while LeaderNode uses the shared hook and a second subscription for task worktree approval wait harness and dashboard adjacent state.
freshness:
  class: code_coupled
risk: high

id: flow.amend_work_packet_scope
type: flow
name: Amend Work Packet Scope
summary: Recompiles an existing Work Packet after replanning while preserving identity and appending amendment provenance.
capabilities:
  - capability.system_model_layer
constraints:
  - constraint.model_bloat_guard
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.model_rot
  - risk.parallel_work_conflicts
suggested_files:
  - server/system-model-tools/amend-work-packet.ts
  - server/system-model/compile.ts
  - server/system-model/freshness.ts
  - server/system-model/store.ts
  - server/system-model-tools/shared.ts
  - shared/system-model/packet.ts
suggested_tests:
  - server/system-model-tools/amend-work-packet.test.ts
  - server/system-model/compile.test.ts
  - server/system-model/freshness.test.ts
  - server/system-model/store.test.ts
steps:
  - Load the stored packet and return a found flag when the model or packet is unavailable.
  - Merge existing capability and flow scope with added object ids then remove requested ids.
  - Recompile through the shared packet compiler with amended scope files owned paths mode head sha and timestamps.
  - Preserve packet id leader session key createdAt non goals match confidence and previous amendment history.
  - Append the new amendment reason and serialized scope delta then save and emit the amended packet event.
freshness:
  class: code_coupled
risk: medium

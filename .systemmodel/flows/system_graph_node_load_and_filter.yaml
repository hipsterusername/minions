id: flow.system_graph_node_load_and_filter
type: flow
name: System Graph Node Load And Filter
summary: A leader opens a System Model node that requests get_system_graph, renders capability and flow rows, filters lenses and relations, and shows related object details.
capabilities:
  - capability.canvas_ui
constraints:
  - constraint.model_bloat_guard
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.model_rot
  - risk.command_contract_drift
suggested_files:
  - src/Canvas.tsx
  - src/nodes/SystemGraphNode.tsx
  - src/nodes/system-graph-model.ts
  - src/system-graph.css
  - shared/system-model/graph.ts
suggested_tests:
  - src/nodes/SystemGraphNode.test.tsx
  - src/nodes/system-graph-model.test.ts
steps:
  - Leader node action calls openSystemModelForLeader, reads the leader sessionKey, and creates a non user creatable system graph node beside the leader.
  - SystemGraphNodeRenderer subscribes to the leader session topic, sends get_system_graph with a node scoped requestId, and accepts only matching responses.
  - Successful responses hydrate graph nodes, edges, and load errors while failures set an error load state.
  - system-graph-model computes primary rows, lens attention filters, relation groups, related counts, active packet labels, usage labels, and connected constraints.
  - The renderer displays primary and lens controls, relation toggles, related cards grouped by relation, resize handle, and inspector details for the selected node.
freshness:
  class: code_coupled
risk: medium

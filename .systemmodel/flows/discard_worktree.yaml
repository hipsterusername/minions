id: flow.discard_worktree
type: flow
name: Discard Worktree
summary: discard_worktree removes the isolated worktree and branch without merging clears pending approval cancels non-terminal child tasks and returns the leader to the project cwd.
capabilities:
  - capability.worktree_approval
constraints:
  - constraint.bus_only_broadcasts
decisions:
  - decision.worktree_isolation
  - decision.graph_as_bus
risks:
  - risk.parallel_work_conflicts
  - risk.session_state_drift
  - risk.command_contract_drift
suggested_files:
  - server/commands/discard-worktree.ts
  - server/commands/helpers.ts
  - server/worktree-create.ts
  - server/worktree.ts
  - server/task-lifecycle.ts
  - src/ChangesView.tsx
suggested_tests:
  - server/commands/discard-worktree.test.ts
  - server/worktree-create.test.ts
  - src/ChangesView.test.tsx
steps:
  - SessionChangesPanel confirms discard and sends discard_worktree for the session.
  - discard_worktree validates sessionKey and host.worktree then clears pending approval state before removal.
  - removeWorktree runs git worktree remove force and git branch delete for the derived canvas session branch using the projectPath.
  - On success the host worktree is cleared cwd resets to projectPath host state is persisted and non-terminal tasks are marked discarded through task lifecycle events.
  - The command emits worktree_removed and approval_resolved with action discarded then sends a successful control_response while remove errors return control_error without mutating host.worktree.
freshness:
  class: code_coupled
risk: high

id: flow.delegate_work_to_minion
type: flow
name: Delegate Work To A Minion
summary: A leader plans bounded work, assigns it to a skill-equipped minion, follows structured progress, and closes, cancels, or retries the task.
capabilities: [capability.task_delegation, capability.skill_library]
constraints: [constraint.bus_only_broadcasts, constraint.model_bloat_guard]
decisions: [decision.graph_as_bus, decision.worktree_isolation, decision.relevance_scoped_context]
risks: [risk.parallel_work_conflicts, risk.session_state_drift, risk.prompt_bloat]
suggested_files: [server/task-tools/plan-task.ts, server/task-tools/assign-task.ts, server/task-tools/task-prompt.ts, server/task-lifecycle.ts]
suggested_tests: [server/task-tools/plan-task.test.ts, server/task-tools/assign-task.test.ts, server/task-lifecycle.test.ts]
steps:
  - Plan a task with a clear objective, ownership boundary, dependencies, and any required model packet.
  - Assign the task with selected skills and start a minion in the appropriate isolated context.
  - Observe structured progress and terminal reporting in the leader task plan.
  - Complete or cancel the work, or start a traceable new attempt after a retryable failure.
freshness:
  class: code_coupled
risk: high

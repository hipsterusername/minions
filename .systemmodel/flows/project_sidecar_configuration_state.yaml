id: flow.project_sidecar_configuration_state
type: flow
name: project_sidecar_configuration_state
summary: Persist project context, settings, skills, and MCP server configuration in sidecar files.
capabilities:
  - capability.persistence_project_state
constraints:
  - constraint.no_cross_tree_imports
  - constraint.server_file_size_ceiling
decisions: []
risks:
  - risk.command_contract_drift
  - risk.model_rot
suggested_files:
  - server/routes/projects/settings.ts
  - server/project-store.ts
  - server/mcp-server-store.ts
  - server/project-store.test.ts
  - server/mcp-server-store.test.ts
  - tests/contracts/projects-settings-routes.test.ts
suggested_tests:
  - pnpm test:run -- tests/contracts/projects-settings-routes.test.ts server/project-store.test.ts server/mcp-server-store.test.ts
steps:
  - Validate the encoded project path before sidecar route reads or writes.
  - Read missing or malformed context, settings, and skills files as safe defaults.
  - Write context, settings, and skills files under the sidecar directory.
  - Merge stored settings with current harness, thinking, worktree, system model, and dashboard defaults.
  - List MCP servers by parsing entries independently and reporting invalid entries.
  - Upsert or delete MCP server entries through schema validation and stable id ordering.
freshness:
  class: code_coupled
risk: medium

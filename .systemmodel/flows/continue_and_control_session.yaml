id: flow.continue_and_control_session
type: flow
name: Continue And Control A Session
summary: A user resumes an idle agent, interrupts an active turn, or stops the session while preserving clear lifecycle and worktree boundaries.
capabilities: [capability.canvas_sessions]
constraints: [constraint.bus_only_broadcasts, constraint.no_cross_tree_imports, constraint.server_file_size_ceiling]
decisions: [decision.graph_as_bus, decision.worktree_isolation]
risks: [risk.session_state_drift, risk.command_contract_drift]
suggested_files: [server/commands/send-message.ts, server/session-host-run.ts, server/session-host-terminate.ts]
suggested_tests: [server/commands/send-message.test.ts, server/commands/interrupt.test.ts, server/commands/stop-session.test.ts]
steps:
  - Resume an idle session while retaining its role, harness, and isolation context.
  - Interrupt only the current active turn when the user requests a pause.
  - Stop and tear down the session cleanly when the user ends it.
freshness:
  class: code_coupled
risk: high

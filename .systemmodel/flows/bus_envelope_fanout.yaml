id: flow.bus_envelope_fanout
type: flow
name: Bus Envelope Fan-Out
summary: Server code emits session, project, global, or prebuilt envelopes through createBus for open WebSockets and in-process subscribers.
capabilities:
  - capability.ws_command_bus
constraints:
  - constraint.bus_only_broadcasts
decisions: []
risks:
  - risk.command_contract_drift
suggested_files:
  - server/bus.ts
  - shared/ws-envelope.ts
suggested_tests:
  - server/bus.test.ts
  - tests/contracts/ws-envelope.test.ts
  - tests/contracts/ws-envelope-roundtrip.test.ts
  - tests/architecture/no-direct-broadcast.test.ts
steps:
  - emitToSession, emitToProject, and emitGlobal call topic helpers to add session-key, project-id, or global topic values to the payload at the top level.
  - emit accepts a pre-wrapped WsEnvelope escape hatch and sends it through the same fanOut path.
  - fanOut first calls broadcast, which JSON stringifies the envelope and sends it to each client whose readyState is OPEN.
  - fanOut then synchronously invokes each in-process subscriber with the same envelope.
  - Subscriber exceptions are caught and logged so one subscriber does not stop the rest of the fan-out path.
freshness:
  class: code_coupled
risk: medium

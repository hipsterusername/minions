id: flow.render_append_component
type: flow
name: render_append adds or replaces components
summary: The leader appends validated components and incoming ids replace existing components on both server and client so duplicate ids do not appear.
capabilities:
  - capability.render_dashboard
constraints:
  - constraint.bus_only_broadcasts
  - constraint.no_cross_tree_imports
decisions:
  - decision.graph_as_bus
risks:
  - risk.render_schema_drift
  - risk.session_state_drift
suggested_files:
  - server/render-tools.ts
  - shared/render-dsl.ts
  - shared/render-defaults.ts
  - src/nodes/RenderNode.tsx
  - tests/contracts/render-dsl-roundtrip.test.ts
  - server/render-tools.test.ts
suggested_tests:
  - tests/contracts/render-dsl-roundtrip.test.ts
  - server/render-tools.test.ts
  - shared/render-dsl.test.ts
steps:
  - render_append parses an array of object shaped components through renderAppendInputSchema.
  - parseRenderComponents validates each incoming component and nested container child before mutation.
  - server state filters out any existing component whose id appears in the incoming set then appends the elided incoming components.
  - the server emits a render_update action append envelope containing the normalized new components.
  - applyRenderMessage removes existing components with incoming ids and appends the new components matching producer side dedupe semantics.
freshness:
  class: code_coupled
risk: high

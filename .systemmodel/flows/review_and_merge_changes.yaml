id: flow.review_and_merge_changes
type: flow
name: Review And Merge Isolated Changes
summary: A user reviews changes from an isolated worktree, satisfies required gates, and merges them with or without completing the session.
capabilities: [capability.worktree_approval, capability.system_model_layer]
constraints: [constraint.review_gated_merges, constraint.bus_only_broadcasts]
decisions: [decision.worktree_isolation, decision.graph_as_bus, decision.relevance_scoped_context]
risks: [risk.merge_bypass, risk.parallel_work_conflicts]
suggested_files: [server/worktree-create.ts, server/worktree-diff.ts, server/commands/approve-changes.ts, server/commands/merge-worktree.ts]
suggested_tests: [server/worktree-diff.test.ts, server/commands/merge-flow.test.ts, tests/contracts/merge-blocking.test.ts]
steps:
  - Create or reuse an isolated worktree and load its complete diff for review.
  - Evaluate review gates against the actual changed files and recorded evidence.
  - Merge and clean the worktree, completing the session only on the explicit approval path.
freshness:
  class: code_coupled
risk: critical

id: flow.register_node_type
type: flow
name: Register A Canvas Node Type
summary: Node modules register renderer metadata into the global registry and CanvasNode resolves the renderer, ports, context flags, and extractor hooks at render time.
capabilities:
  - capability.canvas_ui
constraints: []
decisions: []
risks:
  - risk.render_schema_drift
suggested_files:
  - src/node-registry.ts
  - src/CanvasNode.tsx
  - src/nodes/MarkdownNode.tsx
  - src/nodes/ImageNode.tsx
  - src/nodes/ContextGroupNode.tsx
  - src/nodes/SystemGraphNode.tsx
suggested_tests:
  - src/node-registry.test.ts
  - src/CanvasNode.test.ts
  - src/CanvasNode.test.tsx
  - src/nodes/MarkdownNode.test.tsx
  - src/nodes/ImageNode.test.tsx
  - src/nodes/SystemGraphNode.test.tsx
steps:
  - Node renderer modules call registerNodeType with type, label, defaultSize, render component, creatability, container flags, context flags, and optional extractors.
  - node-registry stores definitions in a module level Map and exposes lookups for node metadata, creatable menus, ownership, context provider checks, and extractors.
  - Canvas builds context menu and command palette items from getUserCreatableNodeTypes while non creatable types are created by targeted UI flows.
  - CanvasNode calls getNodeType for the node type and renders the registered component with stable canvas callbacks.
  - CanvasNode reads graph contracts to render PortDot controls and applies dynamic hiding for locked leader ports and context grouped markdown outputs.
freshness:
  class: code_coupled
risk: medium

id: flow.record_required_verification
type: flow
name: Record Required Verification
summary: Persists a verification result and updates Work Packet freshness and activation state when every required target has passed.
capabilities:
  - capability.system_model_layer
constraints:
  - constraint.review_gated_merges
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.merge_bypass
  - risk.model_rot
suggested_files:
  - server/system-model-tools/record-verification.ts
  - server/system-model/store.ts
  - server/system-model/gates.ts
  - shared/system-model/packet.ts
suggested_tests:
  - server/system-model-tools/record-verification.test.ts
  - server/system-model/store.test.ts
  - server/system-model/gates.test.ts
steps:
  - Validate verification kind target result and optional notes from tool input.
  - Insert or replace the verification row keyed by work packet kind and target.
  - Reload the packet and mark required verification entries passed only when matching rows passed.
  - Move stale blocked freshness back to partially stale when all required rows pass.
  - Activate draft packets that are fully verified then save and emit the verification recorded event.
freshness:
  class: code_coupled
risk: medium

id: flow.send_followup_resume_turn
type: flow
name: send_followup_resume_turn
summary: Continues an existing canvas session by converting user input into a resumed harness turn while preserving harness, resume id, role, thinking config, and worktree lifecycle boundaries.
capabilities:
  - capability.canvas_sessions
constraints:
  - constraint.bus_only_broadcasts
  - constraint.no_cross_tree_imports
decisions:
  - decision.worktree_isolation
  - decision.relevance_scoped_context
risks:
  - risk.session_state_drift
  - risk.command_contract_drift
  - risk.parallel_work_conflicts
suggested_files:
  - server/commands/send-message.ts
  - server/session-registry.ts
  - server/session-host.ts
  - server/session-host-run.ts
  - server/session-persist.ts
  - server/worktree.ts
suggested_tests:
  - server/commands/send-message.test.ts
  - server/session-host.test.ts
  - server/session-registry.test.ts
steps:
  - send_message requires sessionKey and prompt, then resolves the existing host or emits a scoped not found error.
  - If approval is pending, the command clears approval, persists task state, wraps the prompt as a change request, and emits approval_resolved.
  - The command refreshes thinkingConfig and sanitizes follow up attachments while refusing mid thread harness switching.
  - If a leader needs worktree isolation but no worktree remains after merge or discard, a fresh worktree is created, stored on the host, persisted, and announced before resume.
  - SessionRegistry.start re enters the same host with resumeId from host.sessionId, role from host.role, cwd from the current host or worktree, and harness from host.harnessName.
freshness:
  class: code_coupled
risk: medium

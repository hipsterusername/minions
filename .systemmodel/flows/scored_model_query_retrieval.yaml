id: flow.scored_model_query_retrieval
type: flow
name: Scored Model Query Retrieval
summary: Returns exact id or topK scored model matches with linked stubs compact summaries and query usage attribution.
capabilities:
  - capability.system_model_layer
constraints:
  - constraint.model_bloat_guard
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.prompt_bloat
  - risk.model_rot
suggested_files:
  - server/system-model/match.ts
  - server/system-model/store.ts
  - server/system-model-tools/query-system-model.ts
  - server/system-model-tools/shared.ts
  - shared/system-model/objects.ts
suggested_tests:
  - server/system-model/match.test.ts
  - server/system-model/store.test.ts
  - server/system-model-tools/query-system-model.test.ts
steps:
  - Validate that callers provide a non empty query or exact ids and cap topK at ten.
  - Score objects by name keywords step text instruction text summaries and matching file globs.
  - Render match summaries through the per object context budget and keep exact id lookups unscored.
  - Expand direct linked objects as stubs so retrieval exposes adjacent context without flooding output.
  - Record returned matches in system_model_usage with query source and leader session attribution.
freshness:
  class: code_coupled
risk: medium

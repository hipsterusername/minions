id: flow.create_and_arrange_canvas
type: flow
name: Create And Arrange Canvas Nodes
summary: A user adds registered node types to the infinite canvas and keeps manual or automatic placement readable as the workspace grows.
capabilities: [capability.canvas_ui]
constraints: []
decisions: [decision.graph_as_bus]
risks: [risk.render_schema_drift, risk.session_state_drift]
suggested_files: [src/node-registry.ts, src/Canvas.tsx, src/canvas-utils.ts, src/auto-layout.ts]
suggested_tests: [src/node-registry.test.ts, src/canvas-utils.test.ts, src/auto-layout.test.ts]
steps:
  - Resolve a registered node renderer and its default data from the chosen creation surface.
  - Place and select the new node without obscuring existing work.
  - Tidy the canvas into recognizable leader, child, context, and isolated workstreams.
freshness:
  class: code_coupled
risk: medium

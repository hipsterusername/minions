id: flow.auto_layout_and_tidy_drop
type: flow
name: Auto Layout And Tidy Drop Placement
summary: Tidy layout keeps manual drops non overlapping and arranges workstreams by leader clusters, children, context sources, chained leaders, isolates, and context group deltas.
capabilities:
  - capability.canvas_ui
constraints: []
decisions:
  - decision.graph_as_bus
risks:
  - risk.session_state_drift
suggested_files:
  - src/Canvas.tsx
  - src/auto-layout.ts
  - src/canvas-utils.ts
  - src/graph.ts
  - src/CanvasMiniMap.tsx
suggested_tests:
  - src/auto-layout.test.ts
  - src/canvas-utils.test.ts
  - src/CanvasMiniMap.test.ts
steps:
  - Toolbar auto arrange calls handleTidyLayout, computes viewportCenter, and dispatches MOVE_GROUP with computeAutoLayout results.
  - computeAutoLayout snapshots context group membership before movement and builds leader clusters from task edges, render ownership, and context input edges.
  - Cluster layout places context providers above leaders, dashboards and minions to the right, chained leaders producer first, and workstreams in freshness ordered rows.
  - Isolate nodes are placed below cluster rows while nodes spatially inside context groups are excluded.
  - Context group member positions shift by the same delta as their group so containment survives global layout.
  - Drag end tidy placement uses resolveTidyDrop, relocation guards, dashboard drag locking, and camera recentering to snap dropped nodes or leader clusters.
freshness:
  class: code_coupled
risk: medium

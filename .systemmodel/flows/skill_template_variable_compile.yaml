id: flow.skill_template_variable_compile
type: flow
name: Template Variables And Prompt Compile
summary: Selected skill templates replace variable placeholders with provided values, collapse blank lines, and produce an Active Skills addendum without owning task-spawn selection.
capabilities:
  - capability.skill_library
constraints:
  - constraint.model_bloat_guard
  - constraint.no_cross_tree_imports
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.prompt_bloat
  - risk.session_state_drift
suggested_files:
  - src/skills/types.ts
  - server/skills.ts
  - src/nodes/leader/skills/SkillFlyout.tsx
  - src/nodes/leader/skills/SkillVariableInputs.tsx
  - src/nodes/leader/skills/SkillTagChip.tsx
  - src/prompts/build-leader-prompt.ts
suggested_tests:
  - src/skills/types.test.ts
  - server/skills.test.ts
  - src/prompts/build-leader-prompt.test.ts
  - src/nodes/leader/frozen-prompt.test.ts
steps:
  - SkillFlyout lets a leader session tag skills and edit per-skill variable values through SkillVariableInputs.
  - getSkill resolves each selected id from project registry first, then shared built-in fallback.
  - compileSkillTemplate replaces every placeholder with the provided value or an empty string.
  - compileSkills wraps each compiled body in an Active Skills section and appends any subskill map.
  - buildLeaderSystemPrompt combines the base prompt, active skill addendum, and available-skills inventory.
  - Assigning skills to minions remains outside this flow.
freshness:
  class: code_coupled
risk: high

id: flow.compose_durable_cards
type: flow
name: Compose work as durable Kanban cards
summary: Users or the card composer create, import, edit, move, and archive durable WorkItems projected as Kanban cards.
constraints: []
decisions: [ decision.canonical_work_item_lifecycle ]
suggested_files: [ src/KanbanBoard.tsx, src/use-server-kanban.ts, src/nodes/MarkdownNode.tsx, server/agents/card-composer.ts, server/commands/work-items.ts ]
suggested_tests: [ src/KanbanBoard.test.tsx, src/use-server-kanban.dom.test.ts, src/nodes/MarkdownNode.test.tsx, server/agents/card-composer.test.ts, server/commands/work-items.test.ts ]
steps:
  - Create or import a WorkItem with stable request or migration identity and immutable change mode.
  - Persist card metadata and attach the kanban surface binding.
  - Update or move the card with expectedWorkflowRevision against server-owned ordering.
  - Rebuild the board from list_work_items and refresh on rejected optimistic changes.
freshness:
  class: code_coupled
risk: high
domain: domain.execution_lifecycle
primary_capability: capability.durable_work_items
bridges: []
risks: []

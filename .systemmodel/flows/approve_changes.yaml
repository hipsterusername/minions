id: flow.approve_changes
type: flow
name: Approve Changes And Complete Session
summary: The user-approved merge path validates an active worktree enforces merge gates merges and removes the worktree clears approval state and marks the leader session completed.
capabilities:
  - capability.worktree_approval
constraints:
  - constraint.review_gated_merges
  - constraint.bus_only_broadcasts
decisions:
  - decision.worktree_isolation
  - decision.graph_as_bus
risks:
  - risk.merge_bypass
  - risk.parallel_work_conflicts
  - risk.session_state_drift
  - risk.command_contract_drift
suggested_files:
  - server/commands/approve-changes.ts
  - server/commands/helpers.ts
  - server/worktree-merge.ts
  - server/worktree-create.ts
  - server/worktree.ts
  - src/ChangesView.tsx
suggested_tests:
  - server/commands/merge-flow.test.ts
  - server/worktree-merge.test.ts
  - tests/contracts/merge-blocking.test.ts
  - src/ChangesView.test.tsx
steps:
  - SessionChangesPanel confirms merge and sends approve_changes while optimistically setting worktreeStatus to merging.
  - approve_changes validates sessionKey and host.worktree then delegates to runMergeFlow.
  - runMergeFlow evaluates merge gates emits merge_gate_warning when applicable and stops with merge_blocked_by_gate plus control error when enforced gates deny the merge.
  - continueMergeFlow aborts a running host clears wait timers and calls mergeAndCleanup.
  - On success it clears approval state removes the worktree resets cwd to projectPath marks status completed persists and emits session_status worktree_merged approval_resolved and session_completed.
  - On failure it emits worktree_merge_failed preserves the worktree and returns a successful dispatcher control_response carrying result success false.
freshness:
  class: code_coupled
risk: high

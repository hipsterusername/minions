id: flow.worktree_approval_merge
type: flow
name: Worktree Approval Merge
summary: A session diff is inspected, approved, merged into the project branch, persisted, and cleaned up without disturbing the main checkout.
capabilities: [capability.worktree_approval, capability.ws_command_bus, capability.persistence_project_state]
constraints: [constraint.review_gated_merges, constraint.bus_only_broadcasts]
decisions: [decision.worktree_isolation]
risks: [risk.merge_bypass, risk.parallel_work_conflicts]
suggested_files: [server/worktree.ts, server/worktree-merge.ts, server/worktree-diff.ts, server/commands/approve-changes.ts, server/commands/merge-worktree.ts, server/commands/helpers.ts]
suggested_tests: [server/worktree-merge.test.ts, server/worktree-diff.test.ts, server/commands/merge-flow.test.ts, server/commands/merge-worktree.test.ts]
steps: [load worktree diff, request approval, merge target into worktree, fast-forward target ref, emit merge result, remove worktree]
freshness:
  class: code_coupled
risk: critical

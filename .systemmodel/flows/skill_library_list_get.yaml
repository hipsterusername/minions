id: flow.skill_library_list_get
type: flow
name: List And Get Skill Library
summary: Authoring tools expose a merged read view of valid project skills plus shared built-in presets while malformed sidecar entries are ignored.
capabilities:
  - capability.skill_library
constraints:
  - constraint.no_cross_tree_imports
decisions:
  - decision.relevance_scoped_context
risks:
  - risk.command_contract_drift
  - risk.model_rot
suggested_files:
  - server/skill-authoring-tools.ts
  - server/skill-authoring.ts
  - server/skills.ts
  - server/project-store.ts
  - shared/skill-presets.ts
  - server/skill-authoring-tools.test.ts
suggested_tests:
  - server/skill-authoring-tools.test.ts
  - server/skill-authoring.test.ts
  - server/skills.test.ts
steps:
  - list_skills reads the raw project sidecar through readSkills.
  - summarizeSkillLibrary filters raw entries with isRawSkill and tags valid project entries as project source.
  - Shared built-in presets are appended only when no project skill uses the same id.
  - get_skill resolves the full merged library through loadAllSkills and returns JSON for the matching id.
  - Unknown ids return a tool error that tells the agent to call list_skills.
freshness:
  class: code_coupled
risk: medium

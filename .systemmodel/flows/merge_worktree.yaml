id: flow.merge_worktree
type: flow
name: Merge Worktree Without Completing Session
summary: The merge_worktree command merges and cleans the active worktree but intentionally leaves the session alive without approval_resolved or session_completed events.
capabilities:
  - capability.worktree_approval
constraints:
  - constraint.review_gated_merges
  - constraint.bus_only_broadcasts
decisions:
  - decision.worktree_isolation
  - decision.graph_as_bus
risks:
  - risk.parallel_work_conflicts
  - risk.session_state_drift
  - risk.command_contract_drift
suggested_files:
  - server/commands/merge-worktree.ts
  - server/commands/helpers.ts
  - server/worktree-merge.ts
  - server/worktree-create.ts
  - server/worktree.ts
suggested_tests:
  - server/commands/merge-worktree.test.ts
  - server/worktree-merge.test.ts
  - tests/contracts/merge-blocking.test.ts
steps:
  - merge_worktree validates sessionKey and host.worktree independently of approve_changes.
  - It evaluates the same merge gates and blocks before mergeAndCleanup when enforced verdicts deny the merge.
  - mergeAndCleanup auto-commits uncommitted worktree changes merges target into canvas advances the target ref safely and removes the worktree on success.
  - On success the host worktree is cleared cwd returns to projectPath state is persisted and only worktree_merged plus control_response are emitted.
  - On failure the worktree remains attached and worktree_merge_failed is emitted with the failed MergeResult.
freshness:
  class: code_coupled
risk: high

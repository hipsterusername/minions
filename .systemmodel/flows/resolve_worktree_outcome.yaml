id: flow.resolve_worktree_outcome
type: flow
name: Resolve A Worktree Outcome
summary: After review, a user can retry a conflicted merge, explicitly force resolution, or discard isolated changes and return to the project workspace.
capabilities: [capability.worktree_approval]
constraints: [constraint.review_gated_merges, constraint.bus_only_broadcasts]
decisions: [decision.worktree_isolation, decision.graph_as_bus]
risks: [risk.merge_bypass, risk.session_state_drift]
suggested_files: [server/commands/retry-merge.ts, server/commands/force-merge.ts, server/commands/discard-worktree.ts]
suggested_tests: [server/commands/merge-flow.test.ts, server/commands/discard-worktree.test.ts]
steps:
  - Retry the normal gated merge after manually resolving conflicts.
  - Use the explicit force path only when the user accepts its conflict strategy.
  - Or discard the worktree, cancel unfinished child work, and remove the isolated branch.
freshness:
  class: code_coupled
risk: high

id: flow.maintain_system_model
type: flow
name: Maintain The System Model
summary: A maintainer reviews model health signals and updates authored objects when they become stale, unused, orphaned, overbroad, or misleading.
capabilities: [capability.system_model_layer]
constraints: [constraint.model_bloat_guard]
decisions: [decision.relevance_scoped_context]
risks: [risk.model_rot, risk.prompt_bloat]
suggested_files: [.systemmodel, server/system-model/model-health.ts, server/system-model/validate.ts]
suggested_tests: [server/system-model-tools/model-health.test.ts, server/system-model/validate.test.ts]
steps:
  - Inspect freshness, usage, orphan, and applicability coverage signals.
  - Review flagged objects against current code and user-facing architecture.
  - Revise or remove misleading content, then run strict model validation.
freshness:
  class: code_coupled
risk: high

id: flow.render_client_apply_dsl_tree
type: flow
name: client applies and renders the DSL tree
summary: RenderNode receives render_update messages validates them with the shared message schema updates RenderState and dispatches each component type to its renderer.
capabilities:
  - capability.render_dashboard
constraints:
  - constraint.no_cross_tree_imports
decisions:
  - decision.graph_as_bus
risks:
  - risk.render_schema_drift
  - risk.session_state_drift
suggested_files:
  - src/nodes/RenderNode.tsx
  - src/nodes/render/FormComponent.tsx
  - src/nodes/render/ChartComponent.tsx
  - src/nodes/render/ContainerComponents.tsx
  - src/nodes/render/ArtifactComponents.tsx
  - shared/render-dsl.ts
suggested_tests:
  - src/nodes/render/FormComponent.test.tsx
  - src/nodes/render/ChartComponent.test.tsx
  - src/nodes/render/ContainerComponents.test.tsx
  - src/nodes/render/ArtifactComponents.test.tsx
  - shared/render-dsl.test.ts
  - tests/contracts/render-dsl-roundtrip.test.ts
steps:
  - RenderNode subscribes to the paired leader session topic and ignores render_update messages whose leaderSessionKey does not match current node data.
  - renderMessageSchema safeParse gates all incoming payloads before state mutation and records a payload error on invalid messages.
  - applyRenderMessage handles set patch append and remove transitions against the current RenderState.
  - RenderComponentView dispatches core primitives in RenderNode and delegates form chart section tabs image and file preview to files under src nodes render.
  - SectionRenderer and TabsRenderer recursively call the same child dispatcher while form components receive context callbacks for submit_form.
freshness:
  class: code_coupled
risk: high

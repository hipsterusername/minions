id: flow.inspect_system_model
type: flow
name: Inspect the system model and gate evidence
summary: Users and agents query model context, maintain provenance-bearing packet evidence and criterion coverage, reconcile actual diffs, resolve model-update needs, and apply valid gate waivers.
constraints: [ constraint.work_packet_reconciliation ]
decisions: [ decision.role_gated_agent_tools, decision.worktree_isolation_and_approval ]
suggested_files: [ src/SettingsMenu.tsx, src/nodes/SystemGraphNode.tsx, src/nodes/leader/GateStrip.tsx, shared/system-model/packet.ts, shared/system-model/reconcile.ts, shared/leader-prompt.ts, server/agents/leader.ts, server/worktree-diff.ts, server/system-model/compile.ts, server/system-model/reconcile.ts, server/system-model/work-packet-state.ts, server/system-model-tools/**, server/commands/get-system-model-status.ts ]
suggested_tests: [ src/SettingsMenu.test.tsx, src/nodes/SystemGraphNode.test.tsx, src/nodes/leader/GateStrip.test.tsx, shared/system-model/packet.test.ts, shared/system-model/reconcile.test.ts, shared/leader-prompt.test.ts, server/agents/leader.test.ts, server/worktree-diff.test.ts, server/system-model/compile.test.ts, server/system-model/reconcile.test.ts, server/system-model-tools/record-work-packet-evidence.test.ts, server/system-model-tools/reconcile-run.test.ts, server/system-model-tools/record-constraint-verdicts.test.ts, server/system-model-tools/model-health.test.ts, tests/contracts/system-model-commands.test.ts ]
steps:
  - Load repository model status and inspect capability, flow, surface, constraint, risk, and decision relations.
  - Query relevant objects and create or amend a scoped work packet with explicit acceptance criteria.
  - Append provenance-bearing observations, maintain current criterion coverage, and prioritize unresolved gaps or contradictions as signals.
  - Route hard constraints, open high-priority signals, coverage, and bounded recent evidence before broader context hints.
  - After task or graph execution is terminal, reconcile against the stable actual worktree diff without treating runtime completion as packet closure.
  - Resolve constraint verdicts and either validate the smallest necessary canonical model update or record an evidence-backed no-change assessment.
  - Re-evaluate gates and permit a reasoned human waiver only in a mode that allows it.
freshness:
  class: code_coupled
risk: high
domain: domain.platform
primary_capability: capability.system_model_guidance
bridges: []
risks: []

id: flow.client_send_queue_reconnect
type: flow
name: Client Send Queue And Reconnect
summary: Client commands are serialized immediately, sent when open, or queued across connect and reconnect windows until a later open flushes them.
capabilities:
  - capability.ws_command_bus
constraints: []
decisions: []
risks:
  - risk.command_contract_drift
suggested_files:
  - src/use-socket.ts
  - src/api.ts
suggested_tests:
  - src/use-socket.test.tsx
steps:
  - send JSON.stringify serializes the outbound command payload before checking the socket state.
  - If wsRef.current is OPEN, send writes the serialized command directly to the WebSocket.
  - If the socket is connecting, closed, or waiting for token refresh, send appends to pendingSendsRef and drops oldest entries when MAX_PENDING_SENDS is exceeded.
  - On open, useSocket marks connected, resets reconnect state and attempt counters, then flushes queued serialized commands in order.
  - On close, useSocket clears the cached auth token, increments reconnectAttempt, and schedules exponential backoff with jitter until the maximum attempt count is reached.
  - manualReconnect clears pending reconnect timers, closes the existing socket without letting its close handler schedule another retry, clears auth, resets attempts, and starts a fresh connect.
freshness:
  class: code_coupled
risk: medium

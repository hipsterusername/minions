id: flow.render_form_submit_round_trip
type: flow
name: Submit A Dashboard Form
summary: A user completes a dashboard form, receives immediate validation feedback, and resumes the paired leader with the submitted answers.
capabilities: [capability.render_dashboard, capability.canvas_sessions]
constraints: [constraint.bus_only_broadcasts, constraint.no_cross_tree_imports, constraint.model_bloat_guard]
decisions: [decision.graph_as_bus]
risks: [risk.render_schema_drift, risk.command_contract_drift]
suggested_files: [shared/render-form.ts, src/nodes/render/FormComponent.tsx, server/commands/submit-form.ts]
suggested_tests: [shared/render-form.test.ts, src/nodes/render/FormComponent.test.tsx, server/commands/submit-form.test.ts]
steps:
  - Render the form from the shared component contract and validate required answers in the client.
  - Send the answers as a typed submit_form command for the paired leader.
  - Resume the waiting leader with a compact synthetic user turn containing the submission.
freshness:
  class: code_coupled
risk: high

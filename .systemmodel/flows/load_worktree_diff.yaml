id: flow.load_worktree_diff
type: flow
name: Load Worktree Diff
summary: The review panel requests a detailed diff for the active worktree and the server returns committed plus uncommitted file stats and branch commits in a control_response.
capabilities:
  - capability.worktree_approval
constraints:
  - constraint.bus_only_broadcasts
decisions:
  - decision.graph_as_bus
  - decision.worktree_isolation
risks:
  - risk.command_contract_drift
  - risk.render_schema_drift
suggested_files:
  - server/worktree-diff.ts
  - server/commands/get-worktree-diff.ts
  - server/worktree.ts
  - src/ChangesView.tsx
  - src/use-socket.ts
suggested_tests:
  - server/worktree-diff.test.ts
  - server/commands/get-worktree-diff.test.ts
  - src/ChangesView.test.tsx
steps:
  - SessionChangesPanel subscribes to the session topic and sends get_worktree_diff on mount or refresh.
  - get_worktree_diff validates the session and requires host.worktree before calling getDetailedDiff.
  - getDetailedDiff finds the merge base aggregates committed branch numstat with uncommitted worktree numstat enriches name-status and lists commits.
  - The command replies with control_response diff on success or a control_response error on missing worktree or git failure.
freshness:
  class: code_coupled
risk: medium

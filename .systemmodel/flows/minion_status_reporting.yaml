id: flow.minion_status_reporting
type: flow
name: Minion Status Reporting
summary: Minion MCP tools emit structured status envelopes for progress, completion, failure, and blocking while lifecycle projection records steps, terminal results, blocked questions, and quiet exit nudges.
capabilities:
  - capability.task_delegation
constraints:
  - constraint.bus_only_broadcasts
decisions:
  - decision.graph_as_bus
risks:
  - risk.command_contract_drift
  - risk.session_state_drift
  - risk.render_schema_drift
suggested_files:
  - server/minion-tools.ts
  - server/task-lifecycle.ts
  - shared/prompts/minion-system.ts
  - src/nodes/leader/TaskPlanPanel.tsx
  - server/task-tools/types.ts
suggested_tests:
  - server/minion-tools.test.ts
  - server/agents/minion.test.ts
  - server/task-lifecycle.test.ts
  - src/nodes/MinionNode.test.tsx
steps:
  - Minion calls report_step, report_done, report_fail, or report_blocked with schema validated text fields.
  - The minion status tool emits a minion_status payload to the minion session and mirrors it to the leader session when linked.
  - Runtime report handling maps step to reported_step, blocked to reported_blocked, done to reported_done, and fail to reported_fail lifecycle events.
  - reported_step sets status running, updates lastStep, increments stepCount, and rearms the task timeout when a timer exists.
  - report_done and report_fail close the task as completed or failed while report_blocked leaves the task nonterminal with the question in lastStep.
  - A clean minion turn without report_done or report_fail gets one report nudge prompt, then a second quiet clean exit becomes ended_without_report.
freshness:
  class: code_coupled
risk: high

id: constraint.schema_and_project_authorization
type: constraint
statement: Commands and REST writes validate input schemas and independently resolve a stable workspace UUID to its registered canonical source root before applying guarded paths.
applies_to:
  capabilities: []
  flows: []
  surfaces: []
  files:
    - server/commands/schemas.ts
    - server/commands/work-items.ts
    - server/path-guard.ts

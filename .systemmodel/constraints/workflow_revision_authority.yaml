id: constraint.workflow_revision_authority
type: constraint
statement: Kanban update and movement use expectedWorkflowRevision; server ordering, rank, and workflow revision are authoritative.
applies_to:
  capabilities: []
  flows: []
  surfaces:
    - surface.kanban
    - surface.ws_api
  files:
    - src/use-server-kanban.ts
    - server/commands/work-items.ts
    - server/work-item-workflow-repo.ts
severity: high
agent_instruction: Send the last observed workflow revision, refresh or detach optimistic state on conflict, and never fabricate a successful move.
suggested_tests: [ src/use-server-kanban.dom.test.ts, server/commands/work-items.test.ts, server/work-item-repo.test.ts ]
evidence: [ decision.canonical_work_item_lifecycle ]
domain: domain.execution_lifecycle
scope: targeted
guards:
  - capability.durable_work_items

id: constraint.bus_only_broadcasts
type: constraint
statement: Outbound WebSocket messages must go through server/bus.ts helpers so every payload is wrapped in a typed topic envelope, including unicast replies.
applies_to:
  capabilities: [capability.ws_command_bus, capability.canvas_sessions, capability.render_dashboard]
  flows: []
  files: [server/bus.ts, server/ws-connection.ts, tests/architecture/no-direct-broadcast.test.ts]
severity: critical
agent_instruction: Do not add direct broadcast(wss, ...) or raw ws.send call sites outside server/bus.ts; emit through Bus helpers or the unicast helpers.
review_gate: gate.ws_contract_review
suggested_tests: [tests/architecture/no-direct-broadcast.test.ts, server/bus.test.ts, tests/contracts/ws-envelope.test.ts]
evidence: [decision.graph_as_bus]

id: constraint.no_cross_tree_imports
type: constraint
statement: Server and frontend trees must not import each other directly; shared contracts belong under shared/.
applies_to:
  capabilities: [capability.ws_command_bus, capability.render_dashboard, capability.task_delegation, capability.persistence_project_state, capability.skill_library, capability.system_model_layer]
  flows: []
  files: [shared/**/*.ts, tests/architecture/no-cross-tree-imports.test.ts]
severity: high
agent_instruction: Move cross-boundary types or schemas into shared/ instead of importing from server/ into src/ or from src/ into server/.
suggested_tests: [tests/architecture/no-cross-tree-imports.test.ts]
evidence: [decision.graph_as_bus]

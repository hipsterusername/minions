agent_instruction: Keep Git change mode separate from process sandbox policy; honor an explicit sandbox policy before the legacy plan-mode read-only fallback, default authorized roots to workspace-write, require explicit unrestricted access, enforce both axes in Codex, and label unsupported axes unmanaged without claiming enforcement by other harnesses.

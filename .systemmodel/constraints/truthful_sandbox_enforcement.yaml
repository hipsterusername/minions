id: constraint.truthful_sandbox_enforcement
type: constraint
statement: Filesystem scope and approval policy are independent requested axes, and effective guarantees report unsupported harness axes as unmanaged.
applies_to:
  capabilities: []
  flows: []
  surfaces: []
  files:
    - shared/workspace-contracts.ts
    - server/harness/types.ts

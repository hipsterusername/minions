id: constraint.model_bloat_guard
type: constraint
statement: System-model objects should be added only when they change future agent behavior, and every object must point to concrete suggested files or policy globs. Flows must stay narrow so no single flow pulls in the whole model.
applies_to:
  capabilities: [capability.system_model_layer]
  flows: []
  files: [.systemmodel/**/*.yaml, .systemmodel/decisions/*.md, shared/system-model/*.ts, server/system-model/*.ts]
severity: medium
agent_instruction: Prefer editing an existing model object; add a new capability, flow, constraint, decision, or risk only when it changes scoping, review, or implementation behavior. Keep each flow's suggested_files small and specific.
review_gate: gate.system_model_review
suggested_tests: [server/system-model/validate.test.ts]
evidence: [decision.relevance_scoped_context]

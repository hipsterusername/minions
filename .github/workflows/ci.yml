# CI — runs typecheck, the vitest suite, and the production build on
# every PR and on pushes to main.
#
# Per the project testing strategy (`docs/testing-strategy.md` §6), the
# merge gate is `pnpm verify` — typecheck + test:run + build. All three
# legs must stay green. Architecture-fitness tests under
# `tests/architecture/` run as part of `pnpm test:run`.
#
# Action versions are pinned to commit SHAs per global standards.
# Refresh via Dependabot or by re-resolving the tag with:
#   gh api "repos/<owner>/<repo>/git/refs/tags/<tag>" -q '.object.sha'
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR / branch when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow has no need to push or write — keep the default token read-only.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # pnpm version is read from `packageManager` in package.json so the
      # local pnpm and CI pnpm cannot drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (server)
        run: pnpm typecheck:server

      - name: Test
        run: pnpm test:run

      - name: Check licenses
        run: pnpm check:licenses

      - name: Build
        run: pnpm build

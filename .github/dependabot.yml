# Dependabot — keep dependencies and CI actions updated on a weekly cadence
# with a 7-day cooldown so brand-new releases don't immediately propose updates.
# See `docs/testing-strategy.md` and the global development standards.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
      types:
        patterns:
          - "@types/*"
      dev:
        dependency-type: development
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "@types/*"
      prod:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

id: constraint.workspace_changes_are_reviewed
type: constraint
domain: domain.workspace
scope: targeted
guards: [capability.workspace, flow.open_workspace, flow.save_workspace]
statement: Changes to workspace persistence must retain validation and receive review.
applies_to:
  capabilities: [capability.workspace]
  flows: [flow.open_workspace, flow.save_workspace]
  surfaces: [surface.canvas, surface.mobile]
  files: [src/workspace.ts]
severity: high
agent_instruction: Preserve validation on both read and write paths and run the workspace tests.
review_gate: gate.workspace_review
suggested_tests: [src/workspace.test.ts]

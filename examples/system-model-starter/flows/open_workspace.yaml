id: flow.open_workspace
type: flow
name: Open a workspace
summary: A user selects a saved workspace and sees its current contents.
capabilities: [capability.workspace]
constraints: [constraint.workspace_changes_are_reviewed]
suggested_files: [src/workspace.ts]
suggested_tests: [src/workspace.test.ts]
steps:
  - Read the selected workspace from durable storage.
  - Validate it before presenting it to the user.
freshness:
  class: code_coupled
risk: medium

